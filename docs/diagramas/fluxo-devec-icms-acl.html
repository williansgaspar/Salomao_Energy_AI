}
/* ---------- alargar/estreitar a raia de um ator (pedido do Willians,
   22/09/26) — arrasta a alça na base da raia; empurra as raias abaixo,
   recentraliza as caixas que não foram arrastadas manualmente. ---------- */
function ligaResizeLane(g,laneId){
  g.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    e.stopPropagation();
    const s0=vw/cam.w, startY=e.clientY, origH=LAY.laneH[laneId];
    let moveu=false;
    try{ g.setPointerCapture(e.pointerId) }catch(err){}
    const mover=ev=>{
      const dy=(ev.clientY-startY)/s0;
      if(!moveu && Math.abs(ev.clientY-startY)<3) return;
      moveu=true;
      ALTLANE[laneId]=Math.max(NH+10,origH+dy)/ROWH;
      recalcularLayout();
    };
    const soltar=ev=>{
      window.removeEventListener('pointermove',mover);
      window.removeEventListener('pointerup',soltar);
      try{ g.releasePointerCapture(e.pointerId) }catch(err){}
      if(moveu){ salvarAlturaLanes(ALTLANE); buildMini() }
    };
    window.addEventListener('pointermove',mover);
    window.addEventListener('pointerup',soltar);
  });
}
function recalcularLayout(){
  const nSubs=contarSubs(LAY.nos);
  const {laneH,laneY,lanesTotalH}=alturasRaias(LAY.lanes,nSubs);
  LAY.laneH=laneH; LAY.laneY=laneY;
  const novoSEGH=PADT+lanesTotalH+GAPSEG;
  LAY.SEGH=novoSEGH; LAY.H=LAY.nseg*novoSEGH-GAPSEG+16;
  const salvas=carregarPosicoes();
  LAY.nos.forEach(n=>{
    if(salvas[n.id]) return; // posição arrastada manualmente não é tocada
    const p=LAY.pos[n.id], sg=p.sg;
    const subN=nSubs[n.lane]||1, subH=laneH[n.lane]/subN, subOff=(n.sub||0)*subH;
    p.y = n.entre ? sg*novoSEGH+PADT+laneY[n.entre[1]]-NH/2 : sg*novoSEGH+PADT+laneY[n.lane]+subOff+(subH-NH)/2;
    atualizarNo(n.id);
  });
  // Faixa (banda + nome do ator) só existe uma vez, no topo (segmento 0).
  LAY.lanes.forEach(l=>{
    const y=PADT+laneY[l.id], h=laneH[l.id], nm=wrap(l.nome,24,2);
    const rect=svg.querySelector(`rect.band-a[data-lane="${CSS.escape(l.id)}"], rect.band-b[data-lane="${CSS.escape(l.id)}"]`);
    if(rect){ rect.setAttribute('y',y); rect.setAttribute('height',h) }
    const lt=svg.querySelector(`text.lane-t[data-lane="${CSS.escape(l.id)}"]`);
    if(lt) lt.setAttribute('y', y+h/2-(nm.length-1)*9);
    const ls=svg.querySelector(`text.lane-s[data-lane="${CSS.escape(l.id)}"]`);
    if(ls) ls.setAttribute('y', y+h/2+(nm.length-1)*9+18);
    const hnd=svg.querySelector(`rect.lane-resize[data-lane="${CSS.escape(l.id)}"]`);
    if(hnd) hnd.setAttribute('y', y+h-5);
  });
  const posBarrasSalvas=carregarPosBarras();
  svg.querySelectorAll('.fase-barra').forEach(g=>{
    const key=g.dataset.key;
    if(posBarrasSalvas[key]) return; // barra arrastada manualmente não é tocada
    const sg=+g.dataset.sg, row=+g.dataset.row, x=+g.dataset.x;
    g.setAttribute('transform',`translate(${x},${sg*novoSEGH+8+row*28})`);
  });
}

/* ---------- modo edição: excluir etapa/seta, criar seta nova ---------- */
function pointerParaMundo(clientX,clientY){
  const r=stage.getBoundingClientRect(), s=vw/cam.w;
  return {x:cam.x+(clientX-r.left)/s, y:cam.y+(clientY-r.top)/s};
}
function atualizarSelecaoAresta(){
  svg.querySelectorAll('.aresta').forEach(p=>{
    const on=ST.selAresta&&p.dataset.de===ST.selAresta.de&&p.dataset.para===ST.selAresta.para;
    p.classList.toggle('sel-del',!!on);
  });
}
function ligaSelecionarAresta(h){
  h.addEventListener('pointerdown',e=>{
    if(!ST.editando||e.button!==0) return;
    e.stopPropagation();
    const de=h.dataset.de, para=h.dataset.para;
    const ja=ST.selAresta&&ST.selAresta.de===de&&ST.selAresta.para===para;
    ST.selAresta = ja?null:{de,para};
    if(ST.selAresta && ST.sel) fechar();
    atualizarSelecaoAresta();
  });
}
// Sem confirm()/prompt() — bloqueados em alguns visualizadores com sandbox
// (ex.: artifact embutido). Confirma apertando Delete de novo, até 3s.
let pendenteExclusao=null;
function pedirConfirmacao(tipo,chave,msg,efetivar){
  if(pendenteExclusao&&pendenteExclusao.tipo===tipo&&pendenteExclusao.chave===chave){
    clearTimeout(pendenteExclusao.timer); pendenteExclusao=null; efetivar(); return;
  }
  if(pendenteExclusao) clearTimeout(pendenteExclusao.timer);
  pendenteExclusao={tipo,chave,timer:setTimeout(()=>{pendenteExclusao=null},3000)};
  toast(msg);
}
function excluirNoSelecionado(){
  const id=ST.sel; if(!id||!NO[id]) return;
  pedirConfirmacao('no',id,`Aperte Delete de novo pra confirmar: excluir "${NO[id].titulo}"`,()=>{
    const rem=carregarNosRemovidos(); if(!rem.includes(id)) rem.push(id); salvarNosRemovidos(rem);
    fechar(); build(false); visaoGeral(0); toast('Etapa excluída');
  });
}
// Duplicar uma etapa/decisão (pedido do Willians, 22/09/26: "copiar
// entidade") — cria uma cópia idêntica, um pouco deslocada, com "(cópia)"
// no rótulo pra ficar óbvio que precisa editar o texto depois.
function duplicarNoSelecionado(){
  const id=ST.sel; if(!id||!NO[id]) return;
  const orig=NO[id], novoId='copia'+Date.now().toString(36)+Math.floor(Math.random()*1000);
  const novo={...orig, id:novoId, curto:orig.curto+' (cópia)', titulo:orig.titulo+' (cópia)'};
  const novos=carregarNosNovos(); novos.push(novo); salvarNosNovos(novos);
  NO[novoId]=novo;
  const p=LAY.pos[id];
  if(p) salvarPosicao(novoId,p.x+40,p.y+40);
  build(false); selecionar(novoId);
  toast('Etapa duplicada — edite o texto depois, se precisar');
}
// Rotular uma seta criada por você como "Sim"/"Não" (ganha o ícone ✓/✗ se
// sair de um losango) ou tirar o rótulo — pedido do Willians, 22/09/26.
function rotularArestaSelecionada(rot){
  const a=ST.selAresta; if(!a) return;
  const novas=carregarArestasNovas();
  const idx=novas.findIndex(n=>n.de===a.de&&n.para===a.para);
  if(idx<0){ toast('Só dá pra rotular setas criadas por você'); return }
  novas[idx].rot=rot; salvarArestasNovas(novas);
  build(false); toast(rot?`Rótulo: ${rot}`:'Rótulo removido');
}
function excluirArestaSelecionada(){
  const a=ST.selAresta; if(!a) return;
  const key=a.de+'|'+a.para;
  pedirConfirmacao('aresta',key,'Aperte Delete de novo pra confirmar: excluir esta seta',()=>{
    // Seta criada à mão: remove direto da lista de criadas (senão nunca
    // some de verdade — bug achado pelo Willians, 22/09/26). Seta original
    // do DADOS: marca como removida, mesmo esquema de antes.
    const novas=carregarArestasNovas();
    const idx=novas.findIndex(n=>n.de===a.de&&n.para===a.para);
    if(idx>=0){ novas.splice(idx,1); salvarArestasNovas(novas) }
    else { const rem=carregarArestasRemovidas(); if(!rem.includes(key)) rem.push(key); salvarArestasRemovidas(rem) }
    ST.selAresta=null; build(false); toast('Seta excluída');
  });
}
function adicionarAresta(de,deLado,para,paraLado,rot){
  const novas=carregarArestasNovas();
  novas.push({de,deLado,para,paraLado,rot:rot||''});
  salvarArestasNovas(novas);
  build(false); toast('Seta criada');
}
// Lado da caixa mais próximo de um ponto do mundo — usado quando você
// solta em cima da caixa mas não exatamente numa alça dela.
function ladoMaisProximo(id,wx,wy){
  const p=LAY.pos[id];
  const cands=[['topo',p.x+NW/2,p.y],['direita',p.x+NW,p.y+NH/2],['baixo',p.x+NW/2,p.y+NH],['esquerda',p.x,p.y+NH/2]];
  let melhor=cands[0], d0=Infinity;
  cands.forEach(c=>{ const d=(c[1]-wx)**2+(c[2]-wy)**2; if(d<d0){ d0=d; melhor=c } });
  return melhor[0];
}
function ligaConectar(h,id){
  h.addEventListener('pointerdown',e=>{
    if(!ST.editando||e.button!==0) return;
    e.stopPropagation();
    const NS='http://www.w3.org/2000/svg', linha=document.createElementNS(NS,'line');
    linha.setAttribute('class','conectando-preview');
    // Parte da alça usada (topo/direita/baixo/esquerda), não só da direita.
    const deLado=h.dataset.lado;
    const p0=LAY.pos[id], sx=p0.x+ +h.getAttribute('cx'), sy=p0.y+ +h.getAttribute('cy');
    linha.setAttribute('x1',sx); linha.setAttribute('y1',sy); linha.setAttribute('x2',sx); linha.setAttribute('y2',sy);
    svg.appendChild(linha);
    try{ h.setPointerCapture(e.pointerId) }catch(err){}
    const mover=ev=>{ const w=pointerParaMundo(ev.clientX,ev.clientY); linha.setAttribute('x2',w.x); linha.setAttribute('y2',w.y) };
    const soltar=ev=>{
      window.removeEventListener('pointermove',mover);
      window.removeEventListener('pointerup',soltar);
      try{ h.releasePointerCapture(e.pointerId) }catch(err){}
      linha.remove();
      const alvo=document.elementFromPoint(ev.clientX,ev.clientY);
      const destino=alvo&&alvo.closest('.no');
      if(destino && destino.dataset.id!==id){
        // Se soltou bem numa alça do destino, usa o lado dela; senão, o
        // lado da caixa mais perto de onde o mouse soltou.
        const wsolto=pointerParaMundo(ev.clientX,ev.clientY);
        const paraLado = (alvo.classList&&alvo.classList.contains('connect-handle')&&alvo.dataset.id===destino.dataset.id)
          ? alvo.dataset.lado
          : ladoMaisProximo(destino.dataset.id, wsolto.x, wsolto.y);
        adicionarAresta(id,deLado,destino.dataset.id,paraLado,'');
      }
    };
    window.addEventListener('pointermove',mover);
    window.addEventListener('pointerup',soltar);
  });
}
function buildMini(){
  const {nos,pos,W,H}=LAY, m=$('#minisvg');
  m.setAttribute('viewBox',`0 0 ${W} ${H}`);
  m.innerHTML=nos.map(n=>`<rect class="f${n.fase}" x="${pos[n.id].x}" y="${pos[n.id].y}" width="${NW}" height="${NH}" rx="10" style="fill:var(--c);opacity:.85"/>`).join('')+`<rect id="mv" x="0" y="0" width="10" height="10" rx="20"/>`;
}

/* ---------- estados visuais ---------- */
function casa(n){
  if(ST.fases.size && !ST.fases.has(n.fase)) return false;
  if(ST.lane && n.lane!==ST.lane) return false;
  if(ST.q){
    const t=[n.titulo,n.desc,n.prazo,n.docs,n.nota,...(n.base||[]).flatMap(b=>[b.ref,b.t])].join(' ').toLowerCase();
    if(!t.includes(ST.q)) return false;
  }
  return true;
}
function update(){
  const sel=ST.sel, viz=new Set(LAY.nos.map(n=>n.id));
  const viz_ed=LAY.es, nb=new Set();
  if(sel) viz_ed.forEach(e=>{ if(e.de===sel) nb.add(e.para); if(e.para===sel) nb.add(e.de) });
  svg.classList.toggle('focus',!!sel);
  svg.querySelectorAll('.no').forEach(g=>{
    const id=g.dataset.id, n=NO[id];
    g.classList.toggle('sel',id===sel);
    g.classList.toggle('nb',!!sel&&nb.has(id));
    g.classList.toggle('dim', sel ? !(id===sel||nb.has(id)) : !casa(n));
  });
  svg.querySelectorAll('.aresta').forEach(p=>{
    const on=sel&&(p.dataset.de===sel||p.dataset.para===sel);
    p.classList.toggle('on',!!on);
    p.classList.toggle('dim',sel? !on : (!casa(NO[p.dataset.de])||!casa(NO[p.dataset.para])));
    p.setAttribute('marker-end',`url(#${on?'seta-on':'seta'})`);
  });
  svg.querySelectorAll('.aresta-lbl').forEach(t=>{
    t.classList.toggle('on',!!sel&&(t.dataset.de===sel||t.dataset.para===sel));
  });
  svg.querySelectorAll('.fase-barra').forEach(g=>{ g.style.opacity=(ST.fases.size&&!ST.fases.has(+g.dataset.fase))?.25:1 });
  const selN=sel?NO[sel]:null, selP=sel?LAY.pos[sel]:null;
  svg.querySelectorAll('.band-a,.band-b,.lane-t').forEach(el=>{
    // A faixa só existe uma vez (topo) — não filtra mais por segmento do
    // nó selecionado, senão a seleção de uma etapa do 2º segmento nunca
    // acendia a raia lá em cima.
    const on=(ST.lane&&el.dataset.lane===ST.lane)||(selN&&el.dataset.lane===selN.lane);
    el.classList.toggle('lane-on',!!on);
  });
  const tg=svg.querySelector('#atag');
  if(tg){
    if(selN){
      const ln=DADOS.lanes.find(l=>l.id===selN.lane), t=tg.querySelector('text'), r=tg.querySelector('rect');
      tg.style.display=''; t.textContent='▸ '+ln.nome;
      t.setAttribute('x',selP.x+10); t.setAttribute('y',selP.y-11);
      r.setAttribute('x',selP.x); r.setAttribute('y',selP.y-27); r.setAttribute('width',Math.ceil(t.getComputedTextLength())+20);
    } else tg.style.display='none';
  }
  const N=ORDEM.length;
  document.querySelectorAll('.tr-d').forEach(b=>{ b.classList.toggle('cur',b.dataset.id===sel); b.classList.toggle('dim',!sel&&!casa(NO[b.dataset.id])) });
  const tx=$('#tr-txt'); if(tx) tx.textContent = sel ? `Etapa ${IDX[sel]} de ${N} · ${DADOS.fases[NO[sel].fase]}` : `${N} etapas · ${new Set(ORDEM.map(i=>NO[i].fase)).size} fases`;
  const as=$('#ator-sum'); if(as){ const l=DADOS.lanes.find(x=>x.id===ST.lane); as.textContent = l ? 'Ator: '+l.nome.split(/ \/ | e /)[0] : 'Ator' }
  document.querySelectorAll('.ator-b').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.lane||'')===(ST.lane||''))));
}

/* ---------- câmera ---------- */
function medir(){
  const r=stage.getBoundingClientRect(); vw=r.width; vh=r.height;
  const t=Math.ceil($('#top').getBoundingClientRect().bottom-8), b=Math.ceil(vh-$('#bottom').getBoundingClientRect().top-6);
  document.documentElement.style.setProperty('--topH',Math.max(40,t)+'px');
  document.documentElement.style.setProperty('--botH',Math.max(28,b)+'px');
}
function insets(){ return {top:Math.max(40,$('#top').getBoundingClientRect().bottom-4)+6, bot:Math.max(28,vh-$('#bottom').getBoundingClientRect().top)+6} }
function aplicar(){
  svg.setAttribute('viewBox',`${cam.x} ${cam.y} ${cam.w} ${cam.h}`);
  const s=vw/cam.w;
  svg.classList.toggle('z',s>.55); svg.classList.toggle('ov',s<.42);
  const gs=Math.max(18,Math.min(90,44*s));
  stage.style.setProperty('--gs',gs+'px');
  stage.style.setProperty('--gx',(-cam.x*s)%gs+'px'); stage.style.setProperty('--gy',(-cam.y*s)%gs+'px');
  $('#mini').classList.toggle('off', s<fitS*1.3);
  const mv=$('#mv'); if(mv){ mv.setAttribute('x',cam.x); mv.setAttribute('y',cam.y); mv.setAttribute('width',cam.w); mv.setAttribute('height',cam.h) }
}
function alvo(cx,cy,s,px,py){ const w=vw/s; return {x:cx-px/s, y:cy-py/s, w} }
function ir(t,ms){
  if(tween) cancelAnimationFrame(tween);
  const th=t.w*vh/vw;
  if(RM||!ms){ cam.x=t.x;cam.y=t.y;cam.w=t.w;cam.h=th;aplicar();return }
  const a={cx:cam.x+cam.w/2, cy:cam.y+cam.h/2, w:cam.w}, b={cx:t.x+t.w/2, cy:t.y+th/2, w:t.w};
  const t0=performance.now(), ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  const passo=now=>{
    const k=Math.min(1,(now-t0)/ms), e=ease(k);
    const w=Math.exp(Math.log(a.w)+(Math.log(b.w)-Math.log(a.w))*e), h=w*vh/vw;
    const cx=a.cx+(b.cx-a.cx)*e, cy=a.cy+(b.cy-a.cy)*e;
    cam.w=w; cam.h=h; cam.x=cx-w/2; cam.y=cy-h/2; aplicar();
    tween = k<1 ? requestAnimationFrame(passo) : null;
  };
  tween=requestAnimationFrame(passo);
}
function visaoGeral(ms){
  medir(); const {top,bot}=insets(), mx=24;
  const s=Math.min((vw-2*mx)/LAY.W,(vh-top-bot)/LAY.H); fitS=s;
  ir(alvo(LAY.W/2,LAY.H/2,s,vw/2,top+(vh-top-bot)/2),ms);
}
function cardLargura(){
  if(vw<760) return 0;
  return (ST.mini?300:(vw<1100?Math.min(340,vw*.46):400))+24;
}
function focarNo(id,ms){
  medir(); const {top,bot}=insets(), p=LAY.pos[id], mobile=vw<760, cw=cardLargura();
  const livreW=vw-cw, livreH=mobile?vh*.46-top:vh-top-bot;
  const s=Math.max(.75,Math.min(1.6,Math.min(livreW/(COLW*3.8),livreH/(ROWH*3.0))));
  const px=mobile?vw/2:livreW/2, py=top+livreH/2;
  ir(alvo(p.x+NW/2,p.y+NH/2,s,px,py),ms);
}

/* ---------- seleção, cartão e percurso ---------- */
function baseHtml(b){ return `<li><span class="k ${KIND[b.k][1]}">${esc(KIND[b.k][0])}</span><span class="ref">${esc(b.ref)}</span>${b.t?' — '+esc(b.t):''}</li>` }
function cartao(){
  const C=$('#card'), n=NO[ST.sel];
  if(!n){ C.classList.remove('open'); return }
  const lane=DADOS.lanes.find(l=>l.id===n.lane), i=IDX[n.id], N=ORDEM.length;
  let h=`<div class="card-head"><span class="step">Etapa ${i} de ${N}</span><div class="nav">
    <button id="k-prev" aria-label="Etapa anterior" ${i<=1?'disabled':''}>←</button><button id="k-next" aria-label="Próxima etapa" ${i>=N?'disabled':''}>→</button>
    <button id="k-tour" aria-label="${ST.tour?'Pausar':'Iniciar'} apresentação">${ST.tour?'❚❚':'▶'}</button><button id="k-min" aria-label="${ST.mini?'Expandir cartão':'Recolher cartão'}" title="${ST.mini?'Expandir':'Recolher'} cartão">${ST.mini?'▢':'–'}</button><button id="k-close" aria-label="Fechar">✕</button></div></div>
    <div class="prog ${ST.tour?'on':''}" style="--dur:${ST.tourMs}ms"><i></i></div><div class="card-body">`;
  // Editar texto no lugar — sem prompt() (pode ser bloqueado num
  // visualizador com sandbox). Só no modo edição (pedido do Willians,
  // 22/09/26: "alterar o texto de uma entidade").
  if(ST.editando && ST.editandoTexto){
    h+=`<div class="edita-texto"><input id="in-texto" value="${esc(n.titulo)}" maxlength="140">
      <div class="edita-botoes"><button class="btn primary" id="k-salvar-texto">Salvar</button><button class="btn" id="k-cancelar-texto">Cancelar</button></div></div>`;
  } else {
    h+=`<h2>${esc(n.titulo)}${ST.editando?' <button class="btn-editar-texto" id="k-editar-texto" title="Editar texto">✏️</button>':''}</h2>`;
  }
  if(ST.editando){
    h+=`<div class="ator-banner"><small>Responsável</small><select id="sel-lane-no">${DADOS.lanes.map(l=>`<option value="${l.id}" ${l.id===n.lane?'selected':''}>${esc(l.nome)}</option>`).join('')}</select><em>${esc(lane.sub)}</em></div>`;
  } else {
    h+=`<div class="ator-banner"><small>Responsável</small><b>${esc(lane.nome)}</b><em>${esc(lane.sub)}</em></div>`;
  }
  h+=`<div class="tags"><span class="tag fase f${n.fase}">${esc(DADOS.fases[n.fase])}</span></div>`;
  h+=`<p>${esc(n.desc)}</p>`;
  if(n.prazo) h+=`<h3>Prazo</h3><div class="prazo">${esc(n.prazo)}</div>`;
  if(n.docs) h+=`<h3>Documentos</h3><p>${esc(n.docs)}</p>`;
  if(n.base&&n.base.length) h+=`<h3>Detalhes</h3><ul class="base">${n.base.map(baseHtml).join('')}</ul>`;
  if(n.nota) h+=`<h3>Atenção</h3><div class="aviso">${esc(n.nota)}</div>`;
  h+=`</div>`;
  C.innerHTML=h; C.classList.add('open'); C.classList.toggle('min',ST.mini);
  $('#k-prev').onclick=()=>passo(-1); $('#k-next').onclick=()=>passo(1);
  $('#k-close').onclick=fechar; $('#k-tour').onclick=()=>ST.tour?pararTour():iniciarTour();
  $('#k-min').onclick=()=>{ ST.mini=!ST.mini; cartao(); focarNo(ST.sel,600) };
  if(ST.editando && ST.editandoTexto){
    const inp=$('#in-texto'); inp.focus(); inp.select();
    const cancelar=()=>{ ST.editandoTexto=false; cartao() };
    $('#k-salvar-texto').onclick=()=>salvarTextoEditado(inp.value);
    $('#k-cancelar-texto').onclick=cancelar;
    inp.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter'){ e.preventDefault(); salvarTextoEditado(inp.value) } else if(e.key==='Escape'){ e.preventDefault(); cancelar() } };
  } else if(ST.editando){
    $('#k-editar-texto').onclick=()=>{ ST.editandoTexto=true; cartao() };
  }
  if(ST.editando){ const sel=$('#sel-lane-no'); if(sel) sel.onchange=()=>alterarLaneDoNo(sel.value) }
}
function alterarLaneDoNo(novoLaneId){
  const id=ST.sel; if(!id||!NO[id]||NO[id].lane===novoLaneId) return;
  NO[id].lane=novoLaneId;
  // Mesmo cuidado das outras edições: etapa duplicada precisa do registro
  // salvo dela atualizado; etapa original usa a sobreposição separada.
  const novos=carregarNosNovos(), idx=novos.findIndex(n=>n.id===id);
  if(idx>=0){ novos[idx].lane=novoLaneId; salvarNosNovos(novos) }
  else { const t=carregarLanesNos(); t[id]=novoLaneId; salvarLanesNos(t) }
  build(false); selecionar(id);
  toast('Ator alterado');
}
function salvarTextoEditado(valor){
  const id=ST.sel, texto=(valor||'').trim();
  ST.editandoTexto=false;
  if(!texto||!NO[id]){ cartao(); return }
  NO[id].titulo=texto; NO[id].curto=texto;
  // Etapa duplicada: o registro dela é recriado do zero a partir do
  // localStorage a cada layout() — mudar só NO[id] em memória não bastava,
  // a caixa no diagrama voltava pro texto antigo (achado do Willians,
  // 22/09/26). Atualiza o registro salvo da cópia direto.
  const novos=carregarNosNovos(), idx=novos.findIndex(n=>n.id===id);
  if(idx>=0){ novos[idx].titulo=texto; novos[idx].curto=texto; salvarNosNovos(novos) }
  else { const t=carregarTextosNos(); t[id]={curto:texto,titulo:texto}; salvarTextosNos(t) }
  build(false); selecionar(id);
  toast('Texto atualizado');
}
function selecionar(id){
  const n=NO[id]; if(!n) return;
  ST.sel=id; ST.selAresta=null; atualizarSelecaoAresta();
  history.replaceState(null,'','#'+id);
  update(); cartao(); focarNo(id,900);
  if(ST.tour) agendar();
}
function fechar(){ pararTour(); ST.sel=null; history.replaceState(null,'',location.pathname+location.search); update(); cartao(); visaoGeral(900) }
function passo(d){
  if(!ST.sel){ selecionar(ORDEM[d>0?0:ORDEM.length-1]); return }
  const i=IDX[ST.sel]-1+d;
  if(i<0||i>=ORDEM.length){ if(ST.tour) fechar(); return }
  selecionar(ORDEM[i]);
}
function agendar(){ clearTimeout(tourTimer); tourTimer=setTimeout(()=>passo(1),ST.tourMs) }
function iniciarTour(){ ST.tour=true; if(!ST.sel) selecionar(ORDEM[0]); else { cartao(); agendar() } $('#b-tour').textContent='Pausar' }
function pararTour(){ ST.tour=false; clearTimeout(tourTimer); $('#b-tour').textContent='Apresentar'; if(ST.sel) cartao() }

/* ---------- ator, trilha, exportação ---------- */
function buildTrilha(){
  let s='<span class="tr-txt" id="tr-txt"></span><div class="tr-dots">', ult=null;
  ORDEM.forEach((id,i)=>{ const n=NO[id];
    if(ult!==null&&ult!==n.fase) s+='<i class="tr-sep"></i>'; ult=n.fase;
    s+=`<button class="tr-d f${n.fase}" data-id="${id}" title="${i+1}. ${esc(n.titulo)}" aria-label="Etapa ${i+1}: ${esc(n.titulo)}"></button>`;
  });
  $('#trilha').innerHTML=s+'</div>';
  $('#trilha').querySelectorAll('.tr-d').forEach(b=>b.onclick=()=>selecionar(b.dataset.id));
}
function buildAtorMenu(){
  if(ST.lane && !LAY.lanes.some(l=>l.id===ST.lane)) ST.lane=null;
  let h='<button class="ator-b" data-lane="" aria-pressed="true"><span><b>Todos os atores</b></span></button>';
  LAY.lanes.forEach(l=>{
    if(ST.editando && ST.editandoLane===l.id){
      h+=`<div class="ator-edit">
        <input id="in-lane-nome" value="${esc(l.nome)}" placeholder="Nome do ator" maxlength="80">
        <input id="in-lane-sub" value="${esc(l.sub)}" placeholder="Subtítulo" maxlength="160">
        <div class="edita-botoes"><button class="btn primary" data-salvar-lane="${l.id}">Salvar</button><button class="btn" data-cancelar-lane="1">Cancelar</button></div>
      </div>`;
    } else {
      h+=`<div class="ator-linha"><button class="ator-b" data-lane="${l.id}" aria-pressed="false"><span><b>${esc(l.nome)}</b><small>${esc(l.sub)} · ${LAY.nos.filter(n=>n.lane===l.id).length} etapas</small></span></button>${ST.editando?`<button class="btn-editar-texto" data-editar-lane="${l.id}" title="Editar rótulo do ator">✏️</button>`:''}</div>`;
    }
  });
  $('#ator-pop').innerHTML=h;
  $('#ator-pop').querySelectorAll('.ator-b').forEach(b=>b.onclick=()=>{ setLane(b.dataset.lane||null); $('#m-ator').open=false });
  $('#ator-pop').querySelectorAll('[data-editar-lane]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); ST.editandoLane=b.dataset.editarLane; buildAtorMenu(); const i=$('#in-lane-nome'); if(i){ i.focus(); i.select() } }));
  $('#ator-pop').querySelectorAll('.ator-edit input').forEach(inp=>inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); salvarLaneEditada(ST.editandoLane) }
    else if(e.key==='Escape'){ e.preventDefault(); ST.editandoLane=null; buildAtorMenu() }
  }));
  $('#ator-pop').querySelectorAll('[data-salvar-lane]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); salvarLaneEditada(b.dataset.salvarLane) }));
  $('#ator-pop').querySelectorAll('[data-cancelar-lane]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); ST.editandoLane=null; buildAtorMenu() }));
}
function salvarLaneEditada(laneId){
  const nomeInp=$('#in-lane-nome'), subInp=$('#in-lane-sub');
  const nome=(nomeInp&&nomeInp.value||'').trim(), sub=(subInp&&subInp.value||'').trim();
  ST.editandoLane=null;
  if(!nome){ buildAtorMenu(); return }
  const lane=DADOS.lanes.find(l=>l.id===laneId);
  if(lane){ lane.nome=nome; lane.sub=sub }
  const t=carregarTextosLanes(); t[laneId]={nome,sub}; salvarTextosLanes(t);
  build(false);
  toast('Rótulo do ator atualizado');
}
function ligaLanes(){
  svg.querySelectorAll('.lane-t,.lane-s').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); if(moved) return; setLane(el.dataset.lane) }));
}
function setLane(id){ ST.lane=(ST.lane===id)?null:id; if(ST.sel) fechar(); else update() }
function menusFecha(){ document.querySelectorAll('details.menu').forEach(d=>d.open=false) }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600) }

function exportar(modo){
  const cs=getComputedStyle(document.documentElement), full=modo==='fluxo', NS='http://www.w3.org/2000/svg';
  const vars=['--bg0','--bg1','--node','--ink','--mute','--line','--accent','--accent2','--amber','--edge','--edge-on','--band-a','--band-b','--warn-bg','--warn-ink','--glass'];
  const c=svg.cloneNode(true); c.removeAttribute('id'); c.classList.remove('enter','ov'); c.classList.add('z');
  if(full){
    c.classList.remove('focus');
    c.querySelectorAll('.dim,.nb,.sel,.on,.lane-on').forEach(e=>e.classList.remove('dim','nb','sel','on','lane-on'));
    const t=c.querySelector('#atag'); if(t) t.style.display='none';
  }
  const vb=full?{x:0,y:0,w:LAY.W,h:LAY.H}:{x:cam.x,y:cam.y,w:cam.w,h:cam.h};
  const k=Math.min(2,7000/Math.max(vb.w,vb.h)), W=Math.round(vb.w*k), H=Math.round(vb.h*k);
  c.setAttribute('xmlns',NS); c.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); c.setAttribute('width',W); c.setAttribute('height',H);
  c.setAttribute('style',vars.map(v=>`${v}:${cs.getPropertyValue(v).trim()}`).join(';'));
  const st=document.createElementNS(NS,'style'); st.textContent=document.querySelector('style').textContent+'\nsvg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}';
  const bg=document.createElementNS(NS,'rect');
  [['x',vb.x-5],['y',vb.y-5],['width',vb.w+10],['height',vb.h+10],['fill',cs.getPropertyValue('--bg1').trim()]].forEach(a=>bg.setAttribute(a[0],a[1]));
  c.insertBefore(bg,c.firstChild); c.insertBefore(st,c.firstChild);
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H; cv.getContext('2d').drawImage(img,0,0,W,H); URL.revokeObjectURL(url);
    cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b);
      a.download=`fluxograma-${full?'completo':'vista'}.png`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Imagem gerada'); },'image/png');
  };
  img.onerror=()=>toast('Não foi possível gerar a imagem neste navegador');
  img.src=url;
}
function copiarTexto(){
  const n=NO[ST.sel]; if(!n){ toast('Selecione uma etapa primeiro'); return }
  const lane=DADOS.lanes.find(l=>l.id===n.lane);
  const bs=b=>`- [${KIND[b.k][0]}] ${b.ref}${b.t?': '+b.t:''}\n`;
  let t=`Etapa ${IDX[n.id]} de ${ORDEM.length} — ${n.titulo}\nFase: ${DADOS.fases[n.fase]}\nAtor: ${lane.nome} (${lane.sub})\n\n${n.desc}\n`;
  if(n.prazo) t+=`\nPrazo: ${n.prazo}\n`;
  if(n.docs) t+=`\nDocumentos: ${n.docs}\n`;
  if(n.base&&n.base.length) t+=`\nDetalhes:\n`+n.base.map(bs).join('');
  if(n.nota) t+=`\nAtenção: ${n.nota}\n`;
  t+=`\nFonte: RASCUNHO de trabalho do fluxo do processo do Fiscal de Contrato — fora do sistema, data-base 22/09/2026 (revisão em andamento com a A/NMI).`;
  const ok=()=>toast('Texto da etapa copiado');
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');ok()}catch(e){toast('Não foi possível copiar')} ta.remove() };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,fallback); else fallback();
}

/* ---------- apêndices ---------- */
function aba(t){
  document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  const A=$('#modal-body');
  if(t==='tempo'){
    let cur=null, s='<div class="tl"><p class="aviso-mod">Etapas com prazo ou regra automática, na ordem do processo. Clique numa etapa para ir até ela no fluxo.</p>';
    ORDEM.filter(id=>NO[id].prazo).forEach(id=>{ const n=NO[id], ln=DADOS.lanes.find(l=>l.id===n.lane);
      if(n.fase!==cur){ cur=n.fase; s+=`<h4 class="f${n.fase}">${esc(DADOS.fases[n.fase])}</h4>` }
      s+=`<button class="tl-i f${n.fase}" data-id="${id}"><b>${IDX[id]}. ${esc(n.titulo)}</b><span class="a">${esc(ln.nome)}</span><span class="p">${esc(n.prazo)}</span></button>`;
    });
    A.innerHTML=s+'</div>';
    A.querySelectorAll('.tl-i').forEach(b=>b.onclick=()=>{ modal(false); selecionar(b.dataset.id) });
  } else if(t==='prazos'){
    const rows=DADOS.nos.filter(n=>n.prazo).map(n=>`<tr><td class="tema">${esc(n.titulo)}</td><td>${esc(DADOS.fases[n.fase])}</td><td>${esc(n.prazo)}</td></tr>`).join('');
    A.innerHTML=`<table><thead><tr><th>Etapa</th><th>Fase</th><th>Prazo / regra</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else if(t==='lac'){
    A.innerHTML=`<ul>${DADOS.lacunas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  } else if(t==='fontes'){
    A.innerHTML=`<ul>${DADOS.fontes.map(f=>`<li>${esc(f[0])}${f[1]?` — <a href="${esc(f[1])}" target="_blank" rel="noopener">${esc(f[1])}</a>`:''}</li>`).join('')}</ul>`;
  } else {
    const j=estadoAtualJSON();
    A.innerHTML=`<p class="aviso-mod">Tudo que foi arrastado/criado/excluído/editado no navegador, num só bloco — cole isso numa mensagem pro Claude pra ele incorporar de vez no arquivo (o que fica só no navegador não é salvo sozinho no arquivo).</p>
      <textarea id="ta-exportar" readonly style="width:100%;height:50vh;background:var(--bg1);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:.78rem;box-sizing:border-box"></textarea>
      <div style="margin-top:8px"><button class="btn primary" id="b-copiar-exportar">Copiar</button></div>`;
    $('#ta-exportar').value=j;
    $('#b-copiar-exportar').onclick=()=>{
      const ta=$('#ta-exportar'); ta.select();
      const ok=()=>toast('Estado copiado — cole numa mensagem pro Claude');
      const falha=()=>{ try{document.execCommand('copy');ok()}catch(e){toast('Não foi possível copiar — selecione e copie manualmente')} };
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(j).then(ok,falha); else falha();
    };
  }
}
// Junta DADOS com tudo que está salvo no localStorage (posições, setas
// criadas/excluídas, etapas duplicadas/excluídas, texto e ator editados,
// altura de raia, posição de barra/ícone) num só bloco — pra trazer o
// estado do navegador de volta pro arquivo antes de tornar permanente.
function estadoAtualJSON(){
  const removidosNo=new Set(carregarNosRemovidos());
  const novos=carregarNosNovos();
  const posOverrides=carregarPosicoes();
  const nos=[...DADOS.nos,...novos].filter(n=>!removidosNo.has(n.id)).map(n=>{
    const o={...n}; const p=posOverrides[n.id];
    if(p) o._posArrastada={x:Math.round(p.x),y:Math.round(p.y)};
    return o;
  });
  const removidasAr=new Set(carregarArestasRemovidas());
  const arestasBase=DADOS.arestas.filter(a=>!removidasAr.has(a[0]+'|'+a[1]))
    .map(a=>({de:a[0],para:a[1],rot:a[2]||'',volta:!!a[4]}));
  const arestasNovas=carregarArestasNovas().map(a=>({de:a.de,para:a.para,rot:a.rot||'',deLado:a.deLado,paraLado:a.paraLado}));
  return JSON.stringify({
    geradoEm:new Date().toISOString(),
    fases:DADOS.fases,
    lanes:DADOS.lanes,
    alturaLaneArrastada:ALTLANE,
    nos,
    arestas:[...arestasBase,...arestasNovas],
    posBarrasArrastadas:carregarPosBarras(),
    posIconesArrastados:carregarPosIcones()
  }, null, 2);
}
function modal(abrir){ $('#modal').hidden=!abrir; if(abrir) aba(document.querySelector('[role=tab][aria-selected=true]').dataset.t) }

/* ---------- interação: arrastar, zoom, minimapa, teclado ---------- */
let moved=false, drag=null;
function iniciarInteracao(){
  stage.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,id:e.pointerId}; moved=false;
  });
  window.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!moved && Math.hypot(dx,dy)<5) return;
    if(!moved){ moved=true; stage.classList.add('drag'); if(tween){cancelAnimationFrame(tween);tween=null} }
    const s=vw/cam.w; cam.x=drag.cx-dx/s; cam.y=drag.cy-dy/s; aplicar();
  });
  window.addEventListener('pointerup',()=>{ if(drag){ drag=null; stage.classList.remove('drag'); setTimeout(()=>moved=false,0) } });
  stage.addEventListener('wheel',e=>{
    e.preventDefault(); if(tween){cancelAnimationFrame(tween);tween=null}
    const f=Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)), s0=vw/cam.w, s1=Math.max(fitS*.8,Math.min(4.5,s0*f));
    const wx=cam.x+e.clientX/s0, wy=cam.y+e.clientY/s0;
    cam.w=vw/s1; cam.h=cam.w*vh/vw; cam.x=wx-e.clientX/s1; cam.y=wy-e.clientY/s1; aplicar();
  },{passive:false});
  $('#mini').addEventListener('click',e=>{
    const r=$('#minisvg').getBoundingClientRect(), wx=(e.clientX-r.left)/r.width*LAY.W, wy=(e.clientY-r.top)/r.height*LAY.H;
    const s=vw/cam.w; ir({x:wx-vw/s/2,y:wy-vh/s/2,w:cam.w},600);
  });
  stage.addEventListener('click',e=>{ if(moved) return; if(e.target.closest('.no,.lane-t,.lane-s')) return; if(ST.sel) fechar() });
  window.addEventListener('keydown',e=>{
    if(e.target.matches('input')){ if(e.key==='Enter'){ const m=ORDEM.find(id=>casa(NO[id])); if(m) selecionar(m) } if(e.key!=='Escape') return }
    if(e.key==='Escape'){ if(!$('#modal').hidden) modal(false); else if(ST.selAresta){ ST.selAresta=null; atualizarSelecaoAresta() } else if(ST.sel) fechar(); else document.activeElement&&document.activeElement.blur() }
    else if(e.key==='ArrowRight'||e.key==='ArrowDown'){ if(!$('#modal').hidden) return; e.preventDefault(); passo(1) }
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ if(!$('#modal').hidden) return; e.preventDefault(); passo(-1) }
    else if((e.key==='Delete'||e.key==='Backspace') && ST.editando){ e.preventDefault(); if(ST.selAresta) excluirArestaSelecionada(); else if(ST.sel) excluirNoSelecionado() }
    else if((e.ctrlKey||e.metaKey)&&(e.key==='d'||e.key==='D')&&ST.editando&&ST.sel){ e.preventDefault(); duplicarNoSelecionado() }
    else if(ST.editando&&ST.selAresta&&(e.key==='s'||e.key==='S')){ e.preventDefault(); rotularArestaSelecionada('Sim') }
    else if(ST.editando&&ST.selAresta&&(e.key==='n'||e.key==='N')){ e.preventDefault(); rotularArestaSelecionada('Não') }
    else if(ST.editando&&ST.selAresta&&(e.key==='l'||e.key==='L')){ e.preventDefault(); rotularArestaSelecionada('') }
  });
  let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ medir(); ST.sel?focarNo(ST.sel,0):visaoGeral(0) },120) });
}

/* ---------- inicialização ---------- */
function iniciar(){
  const qp=new URLSearchParams(location.search);
  if(qp.get('embed')==='1') document.body.classList.add('embed');
  const tm=qp.get('tema'); if(tm==='dark'||tm==='light') document.documentElement.dataset.theme=tm;
  window.addEventListener('message',e=>{
    if(e.origin!==location.origin) return;
    const d=e.data; if(d&&d.tipo==='tema'&&(d.valor==='dark'||d.valor==='light')) document.documentElement.dataset.theme=d.valor;
  });
  svg=$('#svg'); stage=$('#stage'); medir();
  $('#fases').innerHTML=Object.keys(DADOS.fases).map(f=>`<button class="chip f${f}" data-f="${f}" aria-pressed="false">${esc(DADOS.fases[f])}</button>`).join('');
  $('#fases').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const f=+b.dataset.f;
    ST.fases.has(f)?ST.fases.delete(f):ST.fases.add(f); b.setAttribute('aria-pressed',ST.fases.has(f)); if(ST.sel) fechar(); update() });
  $('#sel-vel').onchange=e=>{ ST.tourMs=+e.target.value; if(ST.sel){ cartao(); if(ST.tour) agendar() } };
  $('#x-fluxo').onclick=()=>{ menusFecha(); exportar('fluxo') };
  $('#x-vista').onclick=()=>{ menusFecha(); exportar('vista') };
  $('#x-texto').onclick=()=>{ menusFecha(); copiarTexto() };
  $('#b-reset-pos').onclick=()=>{
    menusFecha(); limparPosicoes(); limparPosBarras(); limparPosIcones(); limparAlturaLanes(); ALTLANE={};
    const sel=ST.sel; pararTour(); ST.sel=null; history.replaceState(null,'',location.pathname+location.search);
    build(false);
    if(sel&&NO[sel]) selecionar(sel); else visaoGeral(0);
    toast('Arranjo manual redefinido');
  };
  $('#b-reset-estrutura').onclick=()=>{
    menusFecha(); limparEdicoesEstrutura(); limparPosIcones(); ST.selAresta=null;
    pararTour(); ST.sel=null; history.replaceState(null,'',location.pathname+location.search);
    build(false); visaoGeral(0);
    toast('Setas e conectores redefinidos');
  };
  $('#b-editar').onclick=()=>{
    ST.editando=!ST.editando; ST.selAresta=null; ST.editandoTexto=false; ST.editandoLane=null; atualizarSelecaoAresta();
    $('#b-editar').setAttribute('aria-pressed',String(ST.editando));
    svg.classList.toggle('modo-edicao',ST.editando);
    if(ST.sel) cartao();
    buildAtorMenu();
    toast(ST.editando?'Modo edição ligado — selecione e aperte Delete, ou arraste da bolinha pra criar seta':'Modo edição desligado');
  };
  $('#busca').oninput=e=>{ ST.q=e.target.value.trim().toLowerCase(); if(ST.sel) fechar(); update() };
  $('#b-fit').onclick=()=>{ ST.sel?fechar():visaoGeral(900) };
  $('#b-tour').onclick=()=>ST.tour?pararTour():iniciarTour();
  $('#b-theme').onclick=()=>{ const r=document.documentElement, escuro=(r.dataset.theme==='dark')||(!r.dataset.theme&&!matchMedia('(prefers-color-scheme: light)').matches); r.dataset.theme=escuro?'light':'dark' };
  $('#b-apend').onclick=()=>modal(true); $('#b-close-modal').onclick=()=>modal(false);
  $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') modal(false) });
  $('#tabs').addEventListener('click',e=>{ const b=e.target.closest('[role=tab]'); if(b) aba(b.dataset.t) });
  iniciarInteracao();
  build(true); visaoGeral(0);
  const h=location.hash.slice(1);
  if(h&&NO[h]) setTimeout(()=>selecionar(h),RM?0:1400);
}
iniciar();
</script>

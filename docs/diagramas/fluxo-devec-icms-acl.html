<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo DEVEC — ICMS energia ACL (RJ)</title>
<style>
:root{
  --bg0:#060a13; --bg1:#0c1322; --node:#101a2e; --ink:#e8eefc; --mute:#8b9bb8; --line:rgba(140,170,220,.2);
  --glass:rgba(13,20,36,.78); --accent:#38bdf8; --accent2:#818cf8; --amber:#f5a524; --edge:#5d708f; --edge-on:#38bdf8;
  --band-a:rgba(255,255,255,.012); --band-b:rgba(255,255,255,.04); --grid:rgba(120,160,220,.16);
  --warn-bg:rgba(245,165,36,.12); --warn-ink:#f3cf8a; --shadow:0 20px 60px rgba(0,0,0,.55);
  --ok:#22b07d; --bad:#e0556b;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg0:#eef2f9; --bg1:#e2e9f5; --node:#ffffff; --ink:#0f1b33; --mute:#51607d; --line:rgba(30,60,110,.2);
    --glass:rgba(255,255,255,.86); --accent:#0369a1; --accent2:#4f46e5; --amber:#b45309; --edge:#7a8aa6; --edge-on:#0369a1;
    --band-a:rgba(20,40,90,.02); --band-b:rgba(20,40,90,.06); --grid:rgba(30,60,110,.14);
    --warn-bg:#fff6e0; --warn-ink:#7a5200; --shadow:0 20px 50px rgba(20,40,90,.25);
    --ok:#16875e; --bad:#c23a52;
  }
}
:root[data-theme="light"]{
  --bg0:#eef2f9; --bg1:#e2e9f5; --node:#ffffff; --ink:#0f1b33; --mute:#51607d; --line:rgba(30,60,110,.2);
  --glass:rgba(255,255,255,.86); --accent:#0369a1; --accent2:#4f46e5; --amber:#b45309; --edge:#7a8aa6; --edge-on:#0369a1;
  --band-a:rgba(20,40,90,.02); --band-b:rgba(20,40,90,.06); --grid:rgba(30,60,110,.14);
  --warn-bg:#fff6e0; --warn-ink:#7a5200; --shadow:0 20px 50px rgba(20,40,90,.25);
  --ok:#16875e; --bad:#c23a52;
}
*{box-sizing:border-box}
html{font-size:13px}
@media (max-height:640px){html{font-size:12px}}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg0);color:var(--ink);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,summary{font:inherit;color:inherit}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none;
  background:
    radial-gradient(1200px 700px at 20% -10%, color-mix(in srgb,var(--accent2) 16%,transparent), transparent 60%),
    radial-gradient(900px 600px at 100% 110%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 60%),
    radial-gradient(circle, var(--grid) 1.1px, transparent 1.3px) var(--gx,0px) var(--gy,0px) / var(--gs,40px) var(--gs,40px),
    linear-gradient(180deg,var(--bg1),var(--bg0));}
#stage.drag{cursor:grabbing}
svg#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* ---- topo ---- */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;padding:7px 12px 14px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg0) 92%,transparent) 55%,transparent);pointer-events:none}
#top>*{pointer-events:auto}
.brand b{display:block;font-size:.98rem;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;color:var(--mute);font-size:.68rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(56vw,560px)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--glass);backdrop-filter:blur(8px)}
.seg button{background:transparent;border:0;padding:5px 10px;cursor:pointer;font-size:.78rem;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04121c;font-weight:600}
.btn,.menu summary{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9px;padding:5px 10px;cursor:pointer;font-size:.78rem;list-style:none}
.btn:hover,.menu summary:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#03101a;border-color:transparent;font-weight:600}
.btn[aria-pressed="true"]{background:var(--accent);color:#04121c;border-color:transparent;font-weight:600}
.menu{position:relative}.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;min-width:280px;box-shadow:var(--shadow)}
.chk{display:flex;gap:8px;align-items:center;font-size:.85rem;cursor:pointer}.chk input{accent-color:var(--accent);width:16px;height:16px}
input[type=search]{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:.78rem;width:150px;outline:none}
input[type=search]:focus{border-color:var(--accent)}
/* ---- rodapé ---- */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:12px 12px 7px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;justify-content:center;
  background:linear-gradient(0deg,color-mix(in srgb,var(--bg0) 92%,transparent) 55%,transparent);pointer-events:none}
#bottom>*{pointer-events:auto}
.chip{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--glass));backdrop-filter:blur(8px);border-radius:999px;padding:2px 9px;font-size:.7rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);color:#04121c;font-weight:600}
.hint{color:var(--mute);font-size:.66rem;flex-basis:100%;text-align:center;line-height:1.2}
@media (max-height:660px){.hint{display:none}}
.f1{--c:#4f8cff}.f2{--c:#9b6bff}.f3{--c:#19b3c8}.f4{--c:#22b07d}.f5{--c:#d6a51a}.f6{--c:#ee7a4b}.f7{--c:#d6558f}.f8{--c:#39a0a0}.f9{--c:#7d8896}
/* ---- mundo SVG ---- */
.band-a{fill:var(--band-a)}.band-b{fill:var(--band-b)}
.lane-t{fill:var(--ink);font-size:15px;font-weight:600}.lane-s{fill:var(--mute);font-size:11.5px}
.fase-barra{cursor:grab}
.fase-barra.arrastando{cursor:grabbing}
.fase-barra.arrastando rect{filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.ico-decisao{cursor:grab;pointer-events:auto}
.ico-decisao.arrastando{cursor:grabbing}
.ico-decisao.arrastando circle{filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.fase-barra rect{fill:color-mix(in srgb,var(--c) 26%,transparent);stroke:color-mix(in srgb,var(--c) 60%,transparent);stroke-width:1}
.fase-barra text{fill:var(--ink);font-size:15px;font-weight:600}
.lane-resize{fill:transparent;cursor:row-resize}
.lane-resize:hover{fill:color-mix(in srgb,var(--accent) 26%,transparent)}
.aresta{fill:none;stroke:var(--edge);stroke-width:1.6;transition:opacity .35s,stroke .3s}
.aresta.volta{stroke-dasharray:6 5}
.aresta.on{stroke:var(--edge-on);stroke-width:2.2;stroke-dasharray:9 8;animation:flow .9s linear infinite}
.aresta.on.volta{stroke-dasharray:9 8}
.aresta.sel-del{stroke:var(--bad);stroke-width:3}
/* ---- modo edição (Visio-like): excluir/criar etapas e conectores ---- */
.aresta-hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:none}
svg.modo-edicao .aresta-hit{pointer-events:stroke;cursor:pointer}
.connect-handle{fill:var(--accent);stroke:var(--bg1);stroke-width:2;opacity:0;pointer-events:none;transition:opacity .15s}
/* Sempre visível/clicável no modo edição (não só no hover) — num losango a
   alça fica bem na ponta, quase sem área pra "passar o mouse por cima do
   nó" acender ela (achado do Willians, 22/09/26: não conseguia arrastar). */
svg.modo-edicao .connect-handle{opacity:.85;pointer-events:all;cursor:crosshair}
svg.modo-edicao .connect-handle:hover{opacity:1;r:8}
.conectando-preview{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}
svg.modo-edicao .no.sel .corpo{stroke:var(--bad)}
@keyframes flow{to{stroke-dashoffset:-17}}
.aresta-lbl{fill:var(--mute);font-size:11.5px;paint-order:stroke;stroke:var(--bg1);stroke-width:4px;stroke-linejoin:round;opacity:0;transition:opacity .3s;pointer-events:none}
svg.z .aresta-lbl{opacity:.9}.aresta-lbl.on{opacity:1!important;fill:var(--ink)}
svg.focus .aresta-lbl:not(.on){opacity:.12}
.no{cursor:grab;transition:opacity .35s,filter .35s}
.no.arrastando{cursor:grabbing;transition:none}
.no.arrastando .corpo{filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.no .corpo{fill:color-mix(in srgb,var(--c) 15%,var(--node));stroke:var(--c);stroke-width:1.5;transition:stroke-width .2s,filter .25s}
.no.decisao .corpo{stroke-dasharray:5 4;fill:color-mix(in srgb,var(--c) 24%,var(--node));animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:.6}50%{stroke-opacity:1}}
.no.fim .corpo{fill:color-mix(in srgb,var(--c) 70%,var(--node))}
.no.fim text.t{fill:#fff}
.no text.t{fill:var(--ink);font-size:13px;pointer-events:none}
.no:hover .corpo,.no:focus-visible .corpo{stroke-width:2.6;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 70%,transparent))}
.no:focus{outline:none}
.no.sel .corpo{stroke-width:3.4;filter:drop-shadow(0 0 16px var(--c))}
.no.dim{opacity:.16;filter:blur(1.1px)}
.no.nb{opacity:.6}
.aresta.dim{opacity:.1}
.badge-i circle{fill:var(--c)}.badge-i text{fill:#04121c;font-size:11px;font-weight:700}
.badge-p circle{fill:none;stroke:var(--mute);stroke-width:1.5}.badge-p path{stroke:var(--mute);stroke-width:1.5;fill:none}
.io-cluster rect{fill:color-mix(in srgb,var(--node) 60%,transparent);stroke:var(--mute);stroke-width:1;stroke-dasharray:2.5 2}
.ic-db{color:var(--accent)}.ic-doc{color:var(--accent2)}
svg.ov .badge-i{transform:scale(1.9);transform-box:fill-box;transform-origin:center}
svg.ov .no text.t{font-size:15px}
/* ---- entrada ---- */
svg.enter .no{animation:pop .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
/* Compõe com o translate(x,y) do próprio nó (posição arrastável) — sem
   isso o "transform:none" da animação sobrescreveria a posição. */
@keyframes pop{from{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.85)}to{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1)}}
svg.enter .no{transform-box:fill-box;transform-origin:center}
svg.enter .aresta:not(.volta){stroke-dasharray:var(--len);animation:draw .9s ease both;animation-delay:var(--d)}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
svg.enter .aresta.volta{animation:fade .7s ease both;animation-delay:var(--d)}
svg.enter .aresta{marker-end:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* ---- cartão ---- */
#card{position:fixed;z-index:25;top:calc(var(--topH,52px) + 4px);right:12px;bottom:calc(var(--botH,40px) + 4px);width:400px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  transform:translateX(calc(100% + 24px));opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s;overflow:hidden}
#card.open{transform:none;opacity:1}
#card.min{bottom:auto}
#card.min .card-body>*:not(h2):not(.ator-banner){display:none}
#card.min .prog{display:none}
@media (max-width:1100px){#card{width:min(340px,46vw)}}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line)}
.step{font-size:.66rem;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;gap:6px}
.nav button{background:transparent;border:1px solid var(--line);border-radius:7px;width:26px;height:24px;cursor:pointer;font-size:.8rem;line-height:1;padding:0}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:hover{border-color:var(--accent);color:var(--accent)}
.prog{height:3px;background:transparent}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.prog.on i{animation:prog var(--dur,11s) linear forwards}
@keyframes prog{to{width:100%}}
.card-body{padding:10px 14px 14px;overflow:auto;font-size:.86rem;line-height:1.42}
.card-body h2{font-size:1.02rem;margin:0 0 6px;line-height:1.28;letter-spacing:-.01em}
.btn-editar-texto{background:transparent;border:0;cursor:pointer;font-size:.85em;opacity:.7;vertical-align:1px}
.btn-editar-texto:hover{opacity:1}
.edita-texto{margin:0 0 10px}
.edita-texto input{width:100%;background:var(--bg1);color:var(--ink);border:1px solid var(--accent);border-radius:8px;padding:7px 9px;font-size:.92rem;outline:none;box-sizing:border-box}
.edita-botoes{display:flex;gap:6px;margin-top:6px}
.card-body h3{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:12px 0 4px}
.card-body p{margin:0 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{font-size:.64rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.tag.fase{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink)}
.prazo{background:color-mix(in srgb,var(--accent) 12%,transparent);border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;font-size:.84rem}
.aviso{background:var(--warn-bg);border-left:3px solid var(--amber);color:var(--warn-ink);padding:6px 9px;border-radius:6px;font-size:.82rem}
ul.base{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.base li{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:.78rem;line-height:1.38}
ul.base .ref{font-weight:600}
.k{display:inline-block;font-size:.6rem;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;color:#fff;vertical-align:1px}
.k-sis{background:#2563eb}.k-doc{background:#0f8a6a}.k-prz{background:#b5651d}.k-ext{background:#a3479a}.k-norm{background:#7a6a8a}
/* ---- minimapa ---- */
#mini{position:fixed;left:12px;bottom:calc(var(--botH,40px) + 8px);z-index:15;transition:opacity .4s;width:150px;border:1px solid var(--line);border-radius:10px;background:var(--glass);backdrop-filter:blur(8px);overflow:hidden;cursor:pointer}
#mini svg{display:block;width:100%;height:auto}
#mini.off{opacity:0;pointer-events:none}
#mv{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-width:14}
/* ---- ator, trilha, linha do tempo ---- */
.menu .pop .btn{width:100%;text-align:left}
.pop-sep{height:1px;background:var(--line);margin:2px 0}
.chk.lbl{justify-content:space-between}
.chk.lbl select{background:var(--bg1);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:.78rem}
#ator-pop{min-width:260px;max-height:70vh;overflow:auto}
.ator-b{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;font-size:.78rem}
.ator-b small{display:block;color:var(--mute);font-size:.66rem}
.ator-b[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.ator-linha{display:flex;align-items:center;gap:4px}
.ator-linha .ator-b{flex:1}
.ator-edit{display:flex;flex-direction:column;gap:6px;border:1px solid var(--accent);border-radius:8px;padding:8px}
.ator-edit input{background:var(--bg1);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:.78rem;outline:none;box-sizing:border-box}
.ator-edit input:focus{border-color:var(--accent)}
.band-a,.band-b{transition:fill .3s}
.band-a.lane-on,.band-b.lane-on{fill:color-mix(in srgb,var(--accent) 13%,transparent)}
.lane-t,.lane-s{cursor:pointer}
.lane-t.lane-on{fill:var(--accent)}
.ator-banner{margin:0 0 8px;padding:6px 9px;border-radius:8px;background:color-mix(in srgb,var(--accent) 11%,transparent);border-left:3px solid var(--accent)}
.ator-banner small{display:block;font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.ator-banner b{display:block;font-size:.92rem;line-height:1.2}
.ator-banner em{display:block;font-style:normal;font-size:.7rem;color:var(--mute)}
.ator-banner select{display:block;width:100%;background:var(--bg1);color:var(--ink);border:1px solid var(--accent);border-radius:6px;padding:4px 6px;font-size:.86rem;font-weight:600;margin:2px 0;outline:none}
#atag{pointer-events:none}
#atag rect{fill:var(--accent);filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
#atag text{fill:#04121c;font-size:12px;font-weight:700}
#trilha{display:flex;align-items:center;justify-content:center;gap:10px;flex-basis:100%;min-height:15px}
.tr-txt{font-size:.68rem;color:var(--mute);white-space:nowrap}
.tr-dots{display:flex;align-items:center;gap:3px}
.tr-d{width:9px;height:9px;padding:0;border-radius:50%;background:color-mix(in srgb,var(--c) 45%,transparent);border:1px solid var(--c);cursor:pointer;transition:transform .25s,box-shadow .25s,opacity .25s}
.tr-d:hover{transform:scale(1.5)}
.tr-d.cur{transform:scale(1.8);background:var(--c);box-shadow:0 0 9px var(--c)}
.tr-d.dim{opacity:.25}
.tr-sep{width:7px}
#toast{position:fixed;left:50%;bottom:calc(var(--botH,40px) + 14px);transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:.8rem;transition:.35s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.tl h4{margin:16px 0 4px;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.tl-i{display:block;position:relative;width:100%;text-align:left;background:transparent;border:0;border-left:2px solid color-mix(in srgb,var(--c) 60%,transparent);margin-left:8px;padding:6px 10px 6px 16px;cursor:pointer;color:var(--ink)}
.tl-i::before{content:"";position:absolute;left:-7px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg1)}
.tl-i:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}
.tl-i b{font-size:.86rem}.tl-i .a{color:var(--mute);font-size:.72rem;margin-left:6px}
.tl-i .p{display:block;margin-top:2px;font-size:.8rem}
/* ---- apêndices ---- */
#modal{position:fixed;inset:0;z-index:40;background:rgba(3,7,14,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
#modal[hidden]{display:none}
.sheet{width:min(1100px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
[role=tablist]{display:flex;gap:4px;flex-wrap:wrap}
[role=tab]{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:8px 12px;cursor:pointer}
[role=tab][aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#modal-body{padding:14px 16px;overflow:auto}
#modal-body table{border-collapse:collapse;width:100%;font-size:.85rem}
#modal-body th,#modal-body td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
#modal-body th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
#modal-body td.tema{font-weight:600}
#modal-body ul{margin:0;padding-left:18px}#modal-body li{margin:6px 0}
#modal-body a{color:var(--accent)}
.aviso-mod{margin:0 0 12px}
@media (max-height:600px){#mini{display:none}}
@media (max-width:760px){
  .brand span{display:none}
  #card{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:52vh;transform:translateY(calc(100% + 16px))}
  #card.open{transform:none}
  #mini{display:none}
  input[type=search]{width:130px}
}
body.embed .brand span,body.embed #b-theme{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  nos: [
  {id:'A',lane:'CONTRIB',sub:0,col:0,fase:1,modo:'ambos',tipo:'fim',curto:'Novo consumidor livre / UC no ACL',titulo:'Novo consumidor livre / UC no ACL',desc:'Gatilho: consumidor ou unidade que passa a comprar energia no ambiente de contratação livre.'},
  {id:'B',lane:'CONTRIB',sub:0,col:1,fase:1,modo:'ambos',tipo:'etapa',curto:'Credenciar no DEVEC',titulo:'Credenciamento no DEVEC (aba Credenciamento)',desc:'Informar CPF do responsável e captcha; preencher tipo de pessoa, documento, razão social e contato; Salvar. O credenciamento é prévio ao preenchimento e ao envio da DEVEC. A SEFAZ pode credenciar de ofício quem não se credenciar até a data de envio.',nota:'O CPF do responsável deve ser o do certificado digital usado no acesso (manual v1.1, §5). Credenciado voluntariamente ou de ofício que não declarar fica sujeito ao arbitramento pela tarifa do mercado cativo (art. 15, §§ 1º a 3º).',base:[NORM('Res. SEFAZ 720/2014, Anexo XV, art. 15, §§ 1º-3º (redação da Res. 177/2017)','Credenciamento prévio, de ofício e efeito do arbitramento.'),NORM('Manual DEVEC v1.1, §5','Passo a passo do credenciamento.')]},
  {id:'C',lane:'CONTRIB',sub:0,col:2,fase:1,modo:'ambos',tipo:'decisao',curto:'Acesso por procurador?',titulo:'Decisão: o acesso será por procurador?',desc:'O declarante pode outorgar e-Procuração para que um terceiro acesse o DEVEC em seu nome. Na PCRJ, por portaria: administração direta = a CGM realiza a DEVEC; administração indireta = cada órgão/UC declara a sua.',base:[NORM('Anexo XV, art. 16, § 6º (Res. 177/2017)','Uso das procurações eletrônicas da SEFAZ.')]},
  {id:'D',lane:'CONTRIB',sub:1,col:3,fase:1,modo:'ambos',tipo:'etapa',curto:'Outorgar e-Procuração',titulo:'Outorgar e-Procuração ao procurador',desc:'Feita no sistema DeC e e-Procuração da SEFAZ-RJ. O procurador (ou substabelecido) passa a operar o DEVEC, inclusive para declarar.',base:[NORM('Manual DEVEC v1.1, §5.1 e §7','Outorga, aceite e seleção do consumidor representado.')]},
  {id:'E',lane:'CONTRIB',sub:0,col:4,fase:1,modo:'ambos',tipo:'etapa',curto:'Acessar DEVEC com certificado',titulo:'Acessar o DEVEC com certificado digital ICP-Brasil',desc:'e-CNPJ (consumidores PJ, procuradores PJ e distribuidoras) ou e-CPF (consumidores PF e procuradores substabelecidos). O procurador escolhe o consumidor na lista; cadastros e declaração valem sempre para o consumidor selecionado.',base:[NORM('Anexo XV, art. 16, § 7º (Res. 177/2017)','Acesso somente com certificado ICP-Brasil.'),NORM('Manual DEVEC v1.1, §6 e §7','Tipos de certificado e seleção do consumidor.')]},
  {id:'F',lane:'CONTRIB',sub:0,col:5,fase:1,modo:'ambos',tipo:'etapa',curto:'Conferir cadastro do consumidor livre',titulo:'Conferir o cadastro do consumidor livre',desc:'Menu Cadastros > Consumidor livre.',nota:'Se o consumidor é contribuinte com cadastro na Fazenda, os dados não podem ser alterados (manual v1.1, §8.1.1).'},
  {id:'G',lane:'CONTRIB',sub:0,col:6,fase:1,modo:'ambos',tipo:'etapa',curto:'Pesquisar / cadastrar comercializador',titulo:'Pesquisar ou cadastrar o comercializador',desc:'Menu Cadastros > Comercializador. Se não existir no DEVEC, cadastrar (Novo).',nota:'Comercializador inativo ou não cadastrado não pode ser vinculado ao contrato (manual v1.1, §8.3.2).'},
  {id:'H',lane:'CONTRIB',sub:0,col:7,fase:1,modo:'ambos',tipo:'etapa',curto:'Cadastrar contrato',titulo:'Cadastrar o contrato',desc:'Menu Cadastros > Contrato: consumidor livre, comercializador, nº do contrato, início e fim de vigência e marcação de litígio. Situação: Ativo, Inativo ou Cancelado (cancelar exige motivo).',nota:'O contrato precisa estar vigente para ser cadastrado. Marcado "Em litígio", não recebe informações da DEVEC (manual v1.1, §8.3.2). O litígio que torne ilíquido o valor deve ser informado na DEVEC (art. 15, § 4º).',base:[NORM('Manual DEVEC v1.1, §8.3','Cadastro de contrato.')]},
  {id:'I',lane:'CONTRIB',sub:0,col:8,fase:1,modo:'ambos',tipo:'decisao',curto:'Contrato ativo, vigente e sem litígio?',titulo:'Decisão: contrato apto a receber a DEVEC?',desc:'Só contrato Ativo e sem litígio recebe informações da DEVEC e pode ser vinculado a UC.'},
  {id:'J',lane:'CONTRIB',sub:1,col:8,fase:1,modo:'ambos',tipo:'fim',curto:'Contrato não apto: regularizar',titulo:'Contrato não apto: regularizar antes de seguir',desc:'Contrato inativo, cancelado ou em litígio não recebe informações da DEVEC.'},
  {id:'K',lane:'CONTRIB',sub:0,col:9,fase:1,modo:'ambos',tipo:'etapa',curto:'Cadastrar UCs',titulo:'Cadastrar as unidades consumidoras (UCs)',desc:'Menu Cadastros > Unidade consumidora: contrato(s), distribuidor, documento, denominação e código do ativo na CCEE, nº do medidor e endereço. Para UC fora do RJ, usar o distribuidor "Outros".',nota:'Só contrato ativo pode ser vinculado a UC. Dados da UC não são editáveis se ela for contribuinte com cadastro na Fazenda (manual v1.1, §8.4).',base:[NORM('Manual DEVEC v1.1, §8.4','Cadastro de unidade consumidora.')]},
  {id:'L',lane:'CONTRIB',sub:2,col:9,fase:2,modo:'ambos',tipo:'decisao',curto:'Solicitar dispensa da DEVEC?',titulo:'Decisão: solicitar a dispensa anual da entrega da DEVEC?',desc:'A dispensa é pedida uma vez por ano, na janela do início de janeiro, e depende de homologação.',base:[NORM('Anexo XV, art. 17 (Res. 177/2017)','Dispensa anual.')]},
  {id:'M',lane:'CONTRIB',sub:2,col:10,fase:2,modo:'ambos',tipo:'etapa',curto:'Solicitar dispensa (Devec > Dispensa)',titulo:'Solicitar a dispensa em Devec > Dispensa',desc:'Aceitar o termo e clicar em Solicitar Dispensa. Dá para cancelar enquanto a janela estiver vigente. A dispensa abrange todos os fatos geradores de 1º/jan a 31/dez do exercício.',prazo:'De 0h de 1º/jan a 24h de 12/jan',nota:'Homologada a dispensa, a base do ICMS é arbitrada pela tarifa do mercado cativo (art. 17, § 4º, c/c art. 18, § 1º, I, "b").',base:[NORM('Anexo XV, art. 17 e §§ 1º-4º (Res. 177/2017)','Janela, homologação automática após 31/jan e efeito.'),NORM('Manual DEVEC v1.1, §9.1','Procedimento no sistema.')]},
  {id:'N',lane:'CONTRIB',sub:2,col:8,fase:2,modo:'ambos',tipo:'etapa',curto:'Informar DEVEC (menu Informar DEVEC)',titulo:'Informar a DEVEC mensal',desc:'Pessoa jurídica declara, para o conjunto dos estabelecimentos no submercado Sudeste/Centro-Oeste: identificação, contratos de aquisição, consumo por ponto de consumo, preço médio efetivo de aquisição, competência e responsável. O declarante responde pela veracidade. Pode alterar os dados até o fim do prazo.',prazo:'Até 24h do dia 14 do mês seguinte ao consumo',nota:'Prazo: o art. 16 da Res. 177/2017 dizia dia 10; Res. CGM 2082/2025 (PCRJ), CCEE e agenda tributária indicam dia 14. O ato que mudou não foi localizado. Cessão/recompra e aba Resumo: citados na Consulta SEFAZ 54/2021 (resumo), tela não detalhada no manual v1.1.',base:[NORM('Anexo XV, arts. 15 e 16 (Res. 177/2017)','Conteúdo da DEVEC, prazo e responsabilidade do declarante.'),NORM('Res. CGM-Rio 2082/2025, Anexos I-III','Cronograma da PCRJ: DEVEC até o dia 14 do mês subsequente.')]},
  {id:'O',lane:'CONTRIB',sub:2,col:7,fase:2,modo:'ambos',tipo:'etapa',curto:'Confirmar entrega e guardar protocolo',titulo:'Confirmar a entrega e guardar o protocolo',desc:'Após o envio, o sistema emite protocolo automaticamente, que serve de recibo. O protocolo não implica reconhecimento da veracidade das informações. Menu "Consultar protocolo".',nota:'"Código verificador" é detalhe do Gemini, não confirmado.',base:[NORM('Anexo XV, art. 16, §§ 2º-3º (Res. 177/2017)','Protocolo como recibo.')]},
  {id:'P',lane:'SEFAZ',sub:0,col:10,fase:2,modo:'ambos',tipo:'etapa',curto:'Analisar a dispensa',titulo:'SEFAZ analisa a dispensa',desc:'Deferimento ou indeferimento. Sem manifestação da SEFAZ até 31/jan, a dispensa é homologada automaticamente.',prazo:'Até 31/jan; silêncio = homologada'},
  {id:'Q',lane:'SEFAZ',sub:0,col:9,fase:2,modo:'ambos',tipo:'decisao',curto:'Dispensa homologada?',titulo:'Decisão: dispensa homologada?',desc:'Homologada por deferimento ou, na ausência de manifestação, automaticamente.'},
  {id:'R',lane:'DIST',sub:0,col:9,fase:2,modo:'ambos',tipo:'fim',curto:'ICMS-ST pela tarifa do mercado cativo',titulo:'Dispensa vigente: base de cálculo pela tarifa do mercado cativo',desc:'A distribuidora aplica o preço praticado em operação similar no mercado cativo (tarifa-energia homologada pela ANEEL).',base:[NORM('Anexo XV, art. 18, § 1º, I, "b", e § 3º','Preço do mercado cativo como base.')]},
  {id:'S',lane:'DIST',sub:0,col:7,fase:3,modo:'ambos',tipo:'etapa',curto:'Enviar arquivo de consumo real',titulo:'Distribuidora envia o arquivo de Consumo Real',desc:'Leiaute 10.2 do manual: CNPJ/CPF do ponto de consumo e energia real em MWh. O art. 18, II, lista também nº do medidor, código e nome do cliente. Arquivo UTF-8.',prazo:'Dias 01 a 14 (manual v1.1)',nota:'O art. 18, II, na redação de 2017, dizia "até o dia 10". Alinhar com a decisão do prazo da DEVEC.',base:[NORM('Anexo XV, art. 18, II e § 6º (Res. 177/2017)','Envio do arquivo à SEFAZ.'),NORM('Manual DEVEC v1.1, §10.2','Leiaute do consumo real.')]},
  {id:'T',lane:'SEFAZ',sub:0,col:7,fase:3,modo:'ambos',tipo:'etapa',curto:'Disponibilizar arquivo de preço médio',titulo:'SEFAZ disponibiliza o arquivo consolidado de Preço Médio',desc:'Arquivo com as informações consolidadas das declarações prestadas, por ponto de consumo: CNPJ/CPF, status (I Isento, C Cativo, N Normal), quantidade consumida, parcela isenta e preço médio por MWh. Indica os casos em que vale a tarifa cativa: DEVEC não prestada, dispensada, que não mereça fé, ou com litígio.',prazo:'A partir do dia 15 (manual v1.1)',base:[NORM('Anexo XV, art. 19 e § 2º (Res. 177/2017)','Arquivo consolidado e hipóteses da alínea "b".'),NORM('Manual DEVEC v1.1, §10.1','Leiaute do arquivo de preço médio.')]},
  {id:'U',lane:'DIST',sub:0,col:6,fase:3,modo:'ambos',tipo:'etapa',curto:'Baixar arquivo de preço médio',titulo:'Distribuidora baixa o arquivo de Preço Médio',desc:'Perfil Distribuidor: download do arquivo de preço médio e upload do consumo real. O art. 19 (2017) falava em "a partir do dia 11".'},
  {id:'V',lane:'DIST',sub:0,col:5,fase:3,modo:'ambos',tipo:'decisao',curto:'Status da UC no arquivo?',titulo:'Decisão: qual o status da UC no arquivo?',desc:'I = Isento, C = Cativo, N = Normal.'},
  {id:'W',lane:'DIST',sub:0,col:4,fase:3,modo:'ambos',tipo:'etapa',curto:'Base pelo preço médio',titulo:'Normal ou Isento: base de cálculo pelo preço médio do arquivo',desc:'Normal: base pelo preço médio informado. Isento: a parcela isenta é subtraída do consumo real para formar a base. Se a quantidade consumida do arquivo estiver preenchida, a distribuidora a usa; se estiver em branco, usa a energia real medida por ela.',base:[NORM('Anexo XV, art. 18, § 1º, I, "a"','Preço médio efetivo informado pela SEFAZ.'),NORM('Manual DEVEC v1.1, §10.1','Campos 2 a 4 do leiaute.')]},
  {id:'X',lane:'DIST',sub:1,col:4,fase:3,modo:'ambos',tipo:'etapa',curto:'Base pela tarifa do mercado cativo',titulo:'Cativo: base de cálculo pela tarifa do mercado cativo',desc:'Preço praticado pela distribuidora em operação similar no mercado cativo (tarifa-energia homologada pela ANEEL). Em caso fortuito ou força maior que impeça o envio ou recebimento do arquivo, vale o preço do mês anterior.',base:[NORM('Anexo XV, art. 18, § 1º, I, "b" e "c", e § 3º','Alternativas de preço.')]},
  {id:'Y',lane:'DIST',sub:0,col:3,fase:3,modo:'ambos',tipo:'fim',curto:'Emitir NF modelo 6 e apurar o ICMS',titulo:'Distribuidora emite a Nota Fiscal/Conta de Energia (modelo 6) e apura o ICMS',desc:'A distribuidora é substituta tributária. O destaque do ICMS na nota é mera indicação para controle.',nota:'NÃO CONFIRMADO: forma de recolhimento (DARJ/GNRE vêm do Gemini; as resoluções lidas não tratam disso).',base:[NORM('Anexo XV, art. 18, I (Res. 177/2017)','Conteúdo da nota fiscal modelo 6.')]},
  {id:'Z',lane:'CONTRIB',sub:2,col:0,fase:4,modo:'ambos',tipo:'fim',curto:'Erro ou falta de entrega após o dia 14',titulo:'Erro na DEVEC após o prazo, ou DEVEC não entregue no prazo',desc:'Gatilho da retificação (art. 17-A) ou da entrega extemporânea (art. 17-B). Alterações dentro do prazo se fazem direto no sistema, sem esse fluxo.'},
  {id:'Z2',lane:'CONTRIB',sub:2,col:1,fase:4,modo:'ambos',tipo:'decisao',curto:'A DEVEC já foi entregue?',titulo:'Decisão: a DEVEC do mês já foi entregue?',desc:'Define se o caso é retificação (já entregue, com erro) ou entrega extemporânea (não entregue).'},
  {id:'AA',lane:'CONTRIB',sub:2,col:2,fase:4,modo:'ambos',tipo:'etapa',curto:'Retificar pelo Sistema DEVEC (art. 17-A)',titulo:'Retificar a DEVEC pelo Sistema DEVEC e anexar documentos',desc:'Cabe quando o erro gerou destaque de ICMS em valor indevido na nota. Só depois de expirado o prazo. Penalidade do art. 62-B, II, da Lei 2.657/96, sem prejuízo de juros e multa. Anexar os documentos da Tabela "Documentos Petição DEVEC" (entre eles: petição relatando os erros, declaração de não aproveitamento do crédito ou de estorno, cópias das NFs modelo 6 de energia e de TUSD do mês). Acompanhar o andamento no sistema.',base:[NORM('Anexo XV, art. 17-A (Res. SEFAZ 19/2019 e 62/2019)','Retificação, penalidade, documentos e acompanhamento.')]},
  {id:'AE',lane:'CONTRIB',sub:1,col:1,fase:4,modo:'ambos',tipo:'etapa',curto:'Entregar extemporânea (art. 17-B)',titulo:'Entregar a DEVEC extemporânea pelo Sistema DEVEC',desc:'Admitida quando a DEVEC não foi apresentada no prazo. Penalidade do art. 62-B, I, da Lei 2.657/96, sem prejuízo de juros e multa. Aplica-se, no que couber, o art. 17-A. Pela Consulta SEFAZ 54/2021, é preciso solicitar autorização no sistema (manual v1.8B, item 9.2).',base:[NORM('Anexo XV, art. 17-B (Res. SEFAZ 19/2019)','Entrega extemporânea.')]},
  {id:'AB',lane:'SEFAZ',sub:0,col:2,fase:4,modo:'ambos',tipo:'decisao',curto:'Análise da AFE 03: deferir?',titulo:'Decisão: a AFE 03 defere o pedido?',desc:'Compete à Auditoria-Fiscal Especializada de Energia Elétrica e Telecomunicações (AFE 03) analisar e deferir os pedidos relativos à DEVEC.',base:[NORM('Anexo XV, art. 24-A (Res. SEFAZ 62/2019)','Competência da AFE 03.')]},
  {id:'AC',lane:'CONTRIB',sub:2,col:3,fase:4,modo:'ambos',tipo:'fim',curto:'Indeferido: manter cobrança ou ajustar',titulo:'Indeferido: manter a cobrança original ou ajustar pendências',desc:'As resoluções lidas não dizem o que ocorre no indeferimento.',nota:'NÃO CONFIRMADO: desfecho do indeferimento.'},
  {id:'AD',lane:'SEFAZ',sub:0,col:3,fase:4,modo:'ambos',tipo:'etapa',curto:'Enviar arquivo retificador à distribuidora',titulo:'SEFAZ encaminha arquivo retificador à distribuidora',desc:'Após o deferimento, a SEFAZ envia arquivo à distribuidora para ajuste do ICMS. A AFE pode encaminhar arquivo retificador, com anuência do Auditor Fiscal Chefe.',base:[NORM('Anexo XV, art. 17-A, § 2º, e art. 19, § 5º','Arquivo à distribuidora.')]},
  {id:'AF',lane:'DIST',sub:0,col:2,fase:4,modo:'ambos',tipo:'fim',curto:'Corrigir a nota fiscal do mês',titulo:'Distribuidora corrige a nota fiscal do mês de referência',desc:'Imposto destacado maior que o devido: emite nota com os valores corretos e estorna o ICMS da nota com erro (Convênio ICMS 30/2004). Imposto menor: emite nota complementar, com juros de mora.',base:[NORM('Anexo XV, art. 17-A, § 2º, I e II','Procedimento da distribuidora.')]}

// Arestas do DADOS original + o que o Willians criou, menos o que excluiu —

function arestasEfetivas(){

  const base=DADOS.arestas.filter(a=>!removidas.has(a[0]+'|'+a[1]))
    .map(a=>({de:a[0],para:a[1],rot:a[2]||'',modo:a[3]||'ambos',volta:!!a[4],deLado:a[5],paraLado:a[6]}));

  return [...base,...novas];
}

const visivel = x => x.modo==='ambos' || x.modo===ST.cenario;
function wrap(t,max,maxL){
  const w=String(t).split(' '), out=[]; let cur='';
  for(const x of w){ if(cur && (cur+' '+x).length>max){out.push(cur);cur=x} else cur=cur?cur+' '+x:x }
  if(cur) out.push(cur);
  if(out.length>maxL){ out.length=maxL; out[maxL-1]=out[maxL-1].replace(/.{0,2}$/,'…') }
  return out;
}

/* ---------- ícones de entrada/saída e de decisão (pedido do Willians,

function iconeDB(cx,cy){

    <path d="M-4.6,0 A4.6,1.4 0 0 0 4.6,0" fill="none" stroke="currentColor" stroke-width="1"/>
  </g>`;
}
function iconeDoc(cx,cy){
  return `<g class="ic-doc" transform="translate(${cx},${cy})">
    <path d="M-3.2,-4.6 H1 L3.6,-2 V4.6 H-3.2 Z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
    <path d="M1,-4.6 V-2 H3.6" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
  </g>`;
}
function temIO(n){
  return {temDB:!!(n.base&&n.base.some(b=>b.k==='SIS')), temDoc:!!(n.docs||(n.base&&n.base.some(b=>b.k==='DOC')))};
}
function clusterIO(n){
  // Só em etapas retangulares — num losango o canto fica fora da forma.
  if(n.tipo==='decisao') return '';
  const {temDB,temDoc}=temIO(n);
  if(!temDB&&!temDoc) return '';
  const itens=[temDB?'db':null,temDoc?'doc':null].filter(Boolean);
  const w=itens.length*16+8, h=16, bx=NW-w-6, by=NH-h-6;
  const ic=itens.map((t,i)=>{ const cx=bx+8+i*16, cy=by+h/2; return t==='db'?iconeDB(cx,cy):iconeDoc(cx,cy) }).join('');
  return `<g class="io-cluster"><rect x="${bx}" y="${by}" width="${w}" height="${h}" rx="4"/>${ic}</g>`;
}
function iconeSimNao(sim,x,y,de,para,key){
  // Coordenadas locais + transform="translate(x,y)" — arrastável, mesmo
  // esquema das caixas/barras (pedido do Willians, 22/09/26).

  const marca = sim

}

/* ---------- layout ---------- */
// n.sub (0,1,…) põe caixas de uma mesma raia em camadas paralelas — pedido
// do Willians, 22/09/26: "alargar a raia pra comportar as caixas em
// camadas em cima e em baixo". nSubs conta quantas camadas cada raia usa.
function contarSubs(nos){
  const nSubs={}; nos.forEach(n=>{ const s=(n.sub||0)+1; nSubs[n.lane]=Math.max(nSubs[n.lane]||1,s) });
  return nSubs;
}
function alturasRaias(lanes,nSubs){
  const laneH={}, laneY={}; let acc=0;
  lanes.forEach(l=>{ laneH[l.id]=ROWH*(ALTLANE[l.id]??l.h??(nSubs[l.id]||1)); laneY[l.id]=acc; acc+=laneH[l.id] });
  return {laneH,laneY,lanesTotalH:acc};
}
function layout(){
  const removidos=new Set(carregarNosRemovidos());
  const nos = [...DADOS.nos,...carregarNosNovos()].filter(n=>visivel(n)&&!removidos.has(n.id)), ids = new Set(nos.map(n=>n.id));
  const es = arestasEfetivas().filter(e=>visivel(e)&&ids.has(e.de)&&ids.has(e.para));
  // Setas criadas à mão nunca entram no cálculo de coluna — só no desenho
  // — pra não arriscar formar ciclo e quebrar o layout automático.
  const fw = es.filter(e=>!e.volta&&!e.manual);
  const indeg={}, adj={}, pred={};
  nos.forEach(n=>{indeg[n.id]=0;adj[n.id]=[];pred[n.id]=[]});
  fw.forEach(e=>{indeg[e.para]++;adj[e.de].push(e.para);pred[e.para].push(e.de)});
  const fila = nos.filter(n=>indeg[n.id]===0).map(n=>n.id), topo=[];
  while(fila.length){ const id=fila.shift(); topo.push(id); adj[id].forEach(t=>{ if(--indeg[t]===0) fila.push(t) }) }
  const col={}, occ=new Set();
  topo.forEach(id=>{
    // Sub-camadas independentes da mesma raia podem repetir coluna —
    // só colide com quem está na mesma raia E mesma sub-camada.
    let c=0; pred[id].forEach(p=>{ c=Math.max(c,col[p]+1) });
    if(NO[id].col!=null) c=NO[id].col; else
    while(occ.has(NO[id].lane+':'+(NO[id].sub||0)+':'+c)) c++;
    col[id]=c; occ.add(NO[id].lane+':'+(NO[id].sub||0)+':'+c);
  });
  const lanes = DADOS.lanes.filter(l=>nos.some(n=>n.lane===l.id));
  const li = Object.fromEntries(lanes.map((l,i)=>[l.id,i]));
  // Altura de raia variável — l.h (fração de ROWH, default 1, ou nSubs se
  // a raia tiver camadas paralelas) é o ponto de partida; ALTLANE guarda o
  // que o Willians redimensionou na hora (pedido 22/09/26: "alargar ou
  // estreitar as linhas dos atores"). Empilha por altura acumulada em vez
  // de índice fixo.
  const nSubs = contarSubs(nos);
  const {laneH,laneY,lanesTotalH} = alturasRaias(lanes,nSubs);
  let maxC=0; nos.forEach(n=>{ maxC=Math.max(maxC,col[n.id]) });
  // Raias numa única camada, sem dobrar em duas linhas (pedido do
  // Willians, 22/09/26) — com caixa, barra e altura de raia arrastáveis,
  // ele mesmo compacta onde quiser em vez do wrap automático em 2 segmentos.
  let br=null;
  const nseg = br==null?1:2, SEGH = PADT+lanesTotalH+GAPSEG;
  const pos={};
  nos.forEach(n=>{ const c=col[n.id], sg=(br!=null&&c>=br)?1:0;
    // n.entre:[laneA,laneB] posiciona o nó na fronteira entre duas raias
    // adjacentes (ex.: "Início", entre Energia-TE e Infraestrutura-TUSD),
    // em vez de centralizado dentro da própria raia (n.lane).
    const subN=nSubs[n.lane]||1, subH=laneH[n.lane]/subN, subOff=(n.sub||0)*subH;
    const y = n.entre ? sg*SEGH+PADT+laneY[n.entre[1]]-NH/2 : sg*SEGH+PADT+laneY[n.lane]+subOff+(subH-NH)/2;
    pos[n.id]={x:X0+(c-(sg?br:0))*COLW, y, c, l:li[n.lane], sg} });
  const ordem = nos.some(n=>n.col!=null) ? nos.map(n=>n.id) : nos.map(n=>n.id).sort((a,b)=>pos[a].c-pos[b].c||pos[a].l-pos[b].l);
  const ncols = br==null?maxC+1:Math.max(br,maxC-br+1);
  return {nos,es,pos,lanes,laneH,laneY,ordem,nseg,SEGH,W:X0+(ncols-1)*COLW+NW+36, H:nseg*SEGH-GAPSEG+16};
}
// Ponto (mundo) de um lado nomeado da caixa/losango — e sua direção de
// saída/entrada, pro roteamento genérico de setas criadas à mão.
const LADO_DIR={topo:[0,-1],direita:[1,0],baixo:[0,1],esquerda:[-1,0]};
function pontoLado(p,lado){
  if(lado==='topo') return {x:p.x+NW/2,y:p.y};
  if(lado==='direita') return {x:p.x+NW,y:p.y+NH/2};
  if(lado==='baixo') return {x:p.x+NW/2,y:p.y+NH};
  if(lado==='esquerda') return {x:p.x,y:p.y+NH/2};
  return null;
}
// Conecta dois pontos com saída/entrada em qualquer lado (topo/direita/
// baixo/esquerda), sempre em ângulo reto — pra setas criadas no modo
// edição a partir de qualquer vértice (pedido do Willians, 22/09/26).
function rotaGenerica(pA,pB,ladoA,ladoB){
  const stub=20;
  const [dxA,dyA]=LADO_DIR[ladoA]||[1,0], [dxB,dyB]=LADO_DIR[ladoB]||[-1,0];
  const p1={x:pA.x+dxA*stub,y:pA.y+dyA*stub}, p2={x:pB.x+dxB*stub,y:pB.y+dyB*stub};
  const vA=dxA!==0?'h':'v', vB=dxB!==0?'h':'v';
  let meio;
  if(vA==='v'&&vB==='v'){ const midY=(p1.y+p2.y)/2; meio=`V${midY} H${p2.x} V${p2.y}` }
  else if(vA==='h'&&vB==='h'){ const midX=(p1.x+p2.x)/2; meio=`H${midX} V${p2.y} H${p2.x}` }
  else if(vA==='h'){ meio=`H${p2.x} V${p2.y}` }
  else { meio=`V${p2.y} H${p2.x}` }
  // ilx/ily: perto do vértice de saída — é onde o ícone de decisão nasce
  // por padrão (pedido do Willians, 22/09/26).
  return {d:`M${pA.x},${pA.y} L${p1.x},${p1.y} ${meio} L${pB.x},${pB.y}`, lx:(pA.x+pB.x)/2, ly:(pA.y+pB.y)/2-6,
    ilx:pA.x+dxA*32, ily:pA.y+dyA*32};
}
function caminho(a,b,volta,deLado,paraLado){
  // Conectores sempre em ângulo reto — só segmentos H/V (pedido do
  // Willians, 22/09/26), nada de curva/bezier.
  const A=LAY.pos[a], B=LAY.pos[b];
  if(deLado&&paraLado) return rotaGenerica(pontoLado(A,deLado),pontoLado(B,paraLado),deLado,paraLado);
  if(A.sg!==B.sg){
    const sx=A.x+NW, sy=A.y+NH/2, ex=B.x, ey=B.y+NH/2, gy=(Math.min(A.sg,B.sg)+1)*LAY.SEGH-GAPSEG/2-4;
    return {d:`M${sx},${sy} H${sx+22} V${gy} H${ex-24} V${ey} H${ex}`, lx:(sx+ex)/2, ly:gy-7, ilx:sx+30, ily:sy};
  }
  if(!volta){
    const sx=A.x+NW, sy=A.y+NH/2, ex=B.x, ey=B.y+NH/2;
    if(sy===ey){
      // Mesma raia mas pula coluna(s) — outro nó fica exatamente no meio
      // do caminho reto (achado do Willians, 22/09/26: linha atravessando
      // a caixa "Fiscal encaminha o DEVEC à CGM"). Desvia por baixo do
      // próprio nó em vez de cruzar por cima da caixa intermediária.
      if(B.c-A.c>1){ const dip=A.y+NH+8; return {d:`M${sx},${sy} V${dip} H${ex} V${ey}`, lx:(sx+ex)/2, ly:dip-7, ilx:sx+30, ily:sy} }
      return {d:`M${sx},${sy} H${ex}`, lx:(sx+ex)/2, ly:sy-8, ilx:sx+30, ily:sy};
    }
    const midx=(sx+ex)/2;
    // ilx/ily: perto do vértice de saída da origem (topo/direita/baixo do
    // losango ou caixa), não no meio da linha (pedido do Willians,
    // 22/09/26) — o ícone de decisão nasce ali, colado na etapa de onde
    // a seta parte.
    return {d:`M${sx},${sy} H${midx} V${ey} H${ex}`, lx:midx, ly:(sy+ey)/2-6, ilx:sx+30, ily:sy};
  }
  const sx=A.x+NW/2, sy=A.y+NH, ex=B.x+NW/2, ey=B.y+NH, yb=Math.max(sy,ey)+34;
  return {d:`M${sx},${sy} V${yb} H${ex} V${ey}`, lx:(sx+ex)/2, ly:yb-7, ilx:sx, ily:sy+30};
}

/* ---------- construção do mundo ---------- */
function build(animar){
  LAY=layout(); ORDEM=LAY.ordem; IDX={}; ORDEM.forEach((id,i)=>IDX[id]=i+1);
  // Reaplica posições que o Willians arrastou nesta sessão/navegador, por
  // cima do layout automático.
  const salvas=carregarPosicoes();
  Object.keys(salvas).forEach(id=>{ if(LAY.pos[id]) Object.assign(LAY.pos[id],salvas[id]) });
  const posBarrasSalvas=carregarPosBarras();
  const posIconesSalvos=carregarPosIcones();
  const {nos,es,pos,lanes,W,H}=LAY;
  let s=`<defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker>
    <marker id="seta-on" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge-on)"/></marker></defs>`;
  let hnd='';
  for(let sg=0;sg<LAY.nseg;sg++){
    // Faixa (banda + nome do ator) só no segmento 0 — no 2º segmento ela
    // duplicava a mesma raia (achado do Willians, 22/09/26); as etapas
    // continuam exatamente onde estavam, só perdem o fundo/rótulo repetido.
    if(sg===0) lanes.forEach((l,i)=>{
      const y=PADT+LAY.laneY[l.id], h=LAY.laneH[l.id], nm=wrap(l.nome,24,2);
      s+=`<rect class="${i%2?'band-b':'band-a'}" data-lane="${l.id}" x="0" y="${y}" width="${W}" height="${h}"/>`;
      s+=`<text class="lane-t" data-lane="${l.id}" x="24" y="${y+h/2-(nm.length-1)*9}">${nm.map((t,k)=>`<tspan x="24" dy="${k?18:0}">${esc(t)}</tspan>`).join('')}</text>`;
      s+=`<text class="lane-s" data-lane="${l.id}" x="24" y="${y+h/2+(nm.length-1)*9+18}">${esc(l.sub)}</text>`;
      // Alça pra alargar/estreitar a raia. Desenhada por cima de tudo (ver
      // mais abaixo) pra não ficar coberta pelas caixas nas raias finas
      // (TE/TUSD), que sobram pouca margem.
      hnd+=`<rect class="lane-resize" data-lane="${l.id}" x="0" y="${y+h-5}" width="${W}" height="10"/>`;
    });
    const fr={}; nos.forEach(n=>{ const q=pos[n.id]; if(q.sg!==sg) return; const c=q.x; const f=fr[n.fase]||(fr[n.fase]=[c,c]); f[0]=Math.min(f[0],c); f[1]=Math.max(f[1],c) });
    // Fileira por agendamento de intervalos (não por paridade do número da
    // fase) — com trilhas paralelas (CCEE, ajuste/glosa) duas fases podem
    // ter o mesmo índice de ordenação e ainda assim se cruzar em x; a
    // paridade simples sobrepunha o texto (achado do Willians, 22/09/26).
    const barras = Object.keys(fr).map(f=>({f,x1:fr[f][0]-8,x2:fr[f][1]+NW+8})).sort((a,b)=>a.x1-b.x1);
    const filaFim=[];
    barras.forEach(b=>{ let r=0; while(r<filaFim.length && filaFim[r]>b.x1-14) r++; filaFim[r]=b.x2; b.row=r });
    barras.forEach(b=>{
      // Também arrastável (pedido do Willians, 22/09/26); coordenadas
      // locais + transform, mesmo esquema das caixas de etapa.
      const key=sg+':'+b.f, xAuto=b.x1, yAuto=sg*LAY.SEGH+8+b.row*28, wBar=b.x2-b.x1;
      const ov=posBarrasSalvas[key], bx=ov?ov.x:xAuto, by=ov?ov.y:yAuto;
      s+=`<g class="fase-barra f${b.f}" data-fase="${b.f}" data-key="${key}" data-x="${xAuto}" data-row="${b.row}" data-sg="${sg}" transform="translate(${bx},${by})"><rect x="0" y="0" width="${wBar}" height="24" rx="8"/><text x="12" y="17">${esc(DADOS.fases[b.f])}</text></g>`;
    });
  }
  let ed='', lb='', hit='';
  es.forEach(e=>{
    const c=caminho(e.de,e.para,e.volta,e.deLado,e.paraLado), d=(pos[e.de].c*70+160);
    // Faixa invisível mais grossa — guardada à parte pra desenhar por cima
    // de tudo (nós inclusive), senão uma seta que passa por baixo de outra
    // caixa (desvio "dip") fica impossível de clicar (achado do Willians,
    // 22/09/26: "tem seta que não consigo excluir").
    hit+=`<path class="aresta-hit" data-de="${e.de}" data-para="${e.para}" d="${c.d}"/>`;
    ed+=`<path class="aresta${e.volta?' volta':''}" data-de="${e.de}" data-para="${e.para}" d="${c.d}" marker-end="url(#seta)" style="--d:${d}ms"/>`;
    if(e.rot){
      // Decisão: check/✗ no lugar do texto "Sim"/"Não" (pedido do
      // Willians, 22/09/26); as demais etiquetas continuam texto.
      if(NO[e.de].tipo==='decisao'&&(e.rot==='Sim'||e.rot==='Não')){
        const key=e.de+'|'+e.para, ov=posIconesSalvos[key];
        lb+=iconeSimNao(e.rot==='Sim',ov?ov.x:c.ilx,ov?ov.y:c.ily,e.de,e.para,key);
      } else lb+=`<text class="aresta-lbl" data-de="${e.de}" data-para="${e.para}" x="${c.lx}" y="${c.ly}" text-anchor="middle">${esc(e.rot)}</text>`;
    }
  });
  s+=ed;
  nos.forEach(n=>{
    // Marcação em coordenadas locais (0,0) + transform="translate(x,y)" no
    // <g> — permite arrastar a caixa só trocando o transform, sem redesenhar
    // corpo/texto/selo (pedido do Willians, 22/09/26: arrastar as etapas).
    const p=pos[n.id]; let corpo;
    if(n.tipo==='decisao'){
      // Losango — notação padrão de decisão em fluxograma.
      corpo=`<polygon class="corpo" points="${NW/2},0 ${NW},${NH/2} ${NW/2},${NH} 0,${NH/2}"/>`;
    } else if(n.tipo==='fim') corpo=`<rect class="corpo" x="0" y="0" width="${NW}" height="${NH}" rx="${NH/2}"/>`;
    else corpo=`<rect class="corpo" x="0" y="0" width="${NW}" height="${NH}" rx="11"/>`;
    const ln=wrap(n.curto,n.tipo==='etapa'?25:(n.tipo==='decisao'?16:22),3), lh=15, y0=NH/2-(ln.length-1)*lh/2+4.5;
    const txt=ln.map((l,i)=>`<tspan x="${NW/2}" y="${y0+i*lh}">${esc(l)}</tspan>`).join('');
    let bd=`<g class="badge-i"><circle cx="0" cy="0" r="11"/><text x="0" y="4" text-anchor="middle">${IDX[n.id]}</text></g>`;
    if(n.prazo) bd+=`<g class="badge-p"><circle cx="11" cy="${NH-11}" r="7"/><path d="M11,${NH-15} V${NH-11} L14,${NH-9}"/></g>`;
    bd+=clusterIO(n);
    // Alças de conectar — nos 4 vértices/meios da caixa OU do losango, não
    // só à direita — só ativas no modo edição (pedido do Willians,
    // 22/09/26: desenhar uma seta nova a partir de qualquer vértice/meio).
    bd+=[['topo',NW/2,0],['direita',NW,NH/2],['baixo',NW/2,NH],['esquerda',0,NH/2]].map(([lado,hx,hy])=>
      `<circle class="connect-handle" data-id="${n.id}" data-lado="${lado}" cx="${hx}" cy="${hy}" r="6"/>`).join('');
    s+=`<g class="no f${n.fase} ${n.tipo}" data-id="${n.id}" tabindex="0" role="button" aria-label="Etapa ${IDX[n.id]}: ${esc(n.titulo)}" transform="translate(${p.x},${p.y})" style="--d:${p.c*70}ms;--tx:${p.x}px;--ty:${p.y}px"><title>${IDX[n.id]}. ${esc(n.titulo)}</title>${corpo}<text class="t" text-anchor="middle">${txt}</text>${bd}</g>`;
  });
  s+=hnd;
  s+=hit;
  // Rótulos/ícones por último — sentam bem em cima da linha, então
  // precisam ficar acima até da faixa de clique da seta, senão o ✓/✗
  // fica "preso" atrás dela e não dá pra arrastar (achado do Willians,
  // 22/09/26).
  s+=lb;
  s+='<g id="atag" style="display:none"><rect height="21" rx="10.5"/><text/></g>';
  svg.innerHTML=s;
  svg.classList.remove('enter');
  svg.querySelectorAll('.aresta:not(.volta)').forEach(p=>p.style.setProperty('--len',Math.ceil(p.getTotalLength())+2));
  if(animar && !RM){ void svg.getBoundingClientRect(); svg.classList.add('enter'); setTimeout(()=>svg.classList.remove('enter'),2600) }
  svg.querySelectorAll('.no').forEach(g=>{
    ligaArrastoNo(g, g.dataset.id);
    g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();selecionar(g.dataset.id)} });
  });
  svg.querySelectorAll('.fase-barra').forEach(g=>ligaArrastoBarra(g, g.dataset.key));
  svg.querySelectorAll('.ico-decisao').forEach(g=>ligaArrastoIcone(g, g.dataset.key));
  svg.querySelectorAll('.lane-resize').forEach(g=>ligaResizeLane(g, g.dataset.lane));
  svg.querySelectorAll('.aresta-hit').forEach(h=>ligaSelecionarAresta(h));
  svg.querySelectorAll('.connect-handle').forEach(h=>ligaConectar(h, h.dataset.id));
  buildMini(); buildTrilha(); buildAtorMenu(); ligaLanes();
  update();
}
/* ---------- arrastar uma caixa (pedido do Willians, 22/09/26) ---------- */
function atualizarNo(id){
  const g=svg.querySelector(`.no[data-id="${CSS.escape(id)}"]`), p=LAY.pos[id];
  if(g) g.setAttribute('transform',`translate(${p.x},${p.y})`);
  const posIcones=carregarPosIcones();
  LAY.es.forEach(e=>{
    if(e.de!==id && e.para!==id) return;
    const c=caminho(e.de,e.para,e.volta,e.deLado,e.paraLado);
    const de=CSS.escape(e.de), para=CSS.escape(e.para);
    const path=svg.querySelector(`.aresta[data-de="${de}"][data-para="${para}"]`);
    if(path) path.setAttribute('d',c.d);
    const hit=svg.querySelector(`.aresta-hit[data-de="${de}"][data-para="${para}"]`);
    if(hit) hit.setAttribute('d',c.d);
    if(e.rot){ const t=svg.querySelector(`.aresta-lbl[data-de="${de}"][data-para="${para}"]`);
      if(t){
        if(t.classList.contains('ico-decisao')){
          // Ícone ✓/✗: só acompanha o nó se não foi arrastado manualmente.
          if(!posIcones[t.dataset.key]) t.setAttribute('transform',`translate(${c.ilx},${c.ily})`);
        } else { t.setAttribute('x',c.lx); t.setAttribute('y',c.ly) }
      } }
  });
  if(ST.sel===id){ const tg=svg.querySelector('#atag');
    if(tg && tg.style.display!=='none'){ const t=tg.querySelector('text'), r=tg.querySelector('rect');
      t.setAttribute('x',p.x+10); t.setAttribute('y',p.y-11);
      r.setAttribute('x',p.x); r.setAttribute('y',p.y-27); r.setAttribute('width',Math.ceil(t.getComputedTextLength())+20); } }
}
function ligaArrastoNo(g,id){
  g.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    e.stopPropagation();
    const s0=vw/cam.w, startX=e.clientX, startY=e.clientY, origX=LAY.pos[id].x, origY=LAY.pos[id].y;
    let arrastou=false;
    try{ g.setPointerCapture(e.pointerId) }catch(err){}
    const mover=ev=>{
      const dx=(ev.clientX-startX)/s0, dy=(ev.clientY-startY)/s0;
      if(!arrastou && Math.hypot(ev.clientX-startX,ev.clientY-startY)<5) return;
      if(!arrastou){ arrastou=true; g.classList.add('arrastando') }
      LAY.pos[id].x=origX+dx; LAY.pos[id].y=origY+dy;
      atualizarNo(id);
    };
    const soltar=ev=>{
      window.removeEventListener('pointermove',mover);
      window.removeEventListener('pointerup',soltar);
      try{ g.releasePointerCapture(e.pointerId) }catch(err){}
      g.classList.remove('arrastando');
      if(arrastou){ salvarPosicao(id,LAY.pos[id].x,LAY.pos[id].y); buildMini(); }
      else selecionar(id);
    };
    window.addEventListener('pointermove',mover);
    window.addEventListener('pointerup',soltar);
  });
}
function ligaArrastoBarra(g,key){
  g.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    e.stopPropagation();
    const s0=vw/cam.w, startX=e.clientX, startY=e.clientY;
    const m=/translate\(([-\d.]+),([-\d.]+)\)/.exec(g.getAttribute('transform'))||[0,0,0];
    const origX=+m[1], origY=+m[2];
    let arrastou=false;
    try{ g.setPointerCapture(e.pointerId) }catch(err){}
    const mover=ev=>{
      const dx=(ev.clientX-startX)/s0, dy=(ev.clientY-startY)/s0;
      if(!arrastou && Math.hypot(ev.clientX-startX,ev.clientY-startY)<5) return;
      if(!arrastou){ arrastou=true; g.classList.add('arrastando') }
      g.setAttribute('transform',`translate(${origX+dx},${origY+dy})`);
    };
    const soltar=ev=>{
      window.removeEventListener('pointermove',mover);
      window.removeEventListener('pointerup',soltar);
      try{ g.releasePointerCapture(e.pointerId) }catch(err){}
      g.classList.remove('arrastando');
      if(arrastou){ const mm=/translate\(([-\d.]+),([-\d.]+)\)/.exec(g.getAttribute('transform')); salvarPosBarra(key,+mm[1],+mm[2]) }
    };
    window.addEventListener('pointermove',mover);
    window.addEventListener('pointerup',soltar);
  });
}
function ligaArrastoIcone(g,key){

  g.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    e.stopPropagation();

    const origX=+m[1], origY=+m[2];

    try{ g.setPointerCapture(e.pointerId) }catch(err){}

      const dx=(ev.clientX-startX)/s0, dy=(ev.clientY-startY)/s0;
      if(!arrastou && Math.hypot(ev.clientX-startX,ev.clientY-startY)<5) return;
      if(!arrastou){ arrastou=true; g.classList.add('arrastando') }
      g.setAttribute('transform',`translate(${origX+dx},${origY+dy})`);
    };

      window.removeEventListener('pointerup',soltar);

      if(arrastou){ const mm=/translate\(([-\d.]+),([-\d.]+)\)/.exec(g.getAttribute('transform')); salvarPosIcone(key,+mm[1],+mm[2]) }

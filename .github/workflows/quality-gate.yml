name: Salomao quality gate

on:
  push:
  pull_request:
  schedule:
    - cron: "10 10 * * 1-5"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/run_quality_gate.py
